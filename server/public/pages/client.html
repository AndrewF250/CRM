<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогресс проекта</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0; min-height: 100vh; overflow-x: hidden;
            font-family: system-ui, sans-serif; color: #fff; background: #000;
        }
        a { color: inherit; }
        .hidden { display: none !important; }

        /* ===== THEME PICKER ===== */
        .cp-theme-bar {
            position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
            z-index: 200; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
            max-width: calc(100% - 20px); padding: 8px;
            background: rgba(0,0,0,.85); border: 1px solid rgba(255,255,255,.15);
            border-radius: 16px; backdrop-filter: blur(12px);
        }
        .cp-theme-bar[hidden] { display: none !important; }
        .cp-theme-bar .hint {
            width: 100%; text-align: center; font-size: 10px; letter-spacing: .08em;
            text-transform: uppercase; color: #9ca3af; padding: 2px 4px 4px;
        }
        .cp-theme-bar button {
            border: 1px solid rgba(255,255,255,.15); background: transparent; color: #fff;
            font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
            padding: 8px 11px; border-radius: 999px; cursor: pointer;
        }
        .cp-theme-bar button.active { background: #fff; color: #000; }
        .cp-loading, .cp-err { text-align: center; padding: 80px 20px; color: #9ca3af; }
        .cp-err h2 { color: #fff; margin: 0 0 8px; }

        /* ========== 1. NEON — full-bleed hero + stacked neon strips ========== */
        .layout-neon {
            font-family: "Space Grotesk", sans-serif;
            background: #050508;
            min-height: 100vh;
            color: #f8fafc;
        }
        .layout-neon .n-hero {
            min-height: 72vh; display: flex; flex-direction: column; justify-content: flex-end;
            padding: 40px 24px 36px; position: relative; overflow: hidden;
            border-bottom: 1px solid rgba(0,240,255,.25);
        }
        .layout-neon .n-hero::before {
            content: ''; position: absolute; inset: -20%;
            background:
                radial-gradient(circle at 20% 30%, rgba(0,240,255,.25), transparent 40%),
                radial-gradient(circle at 80% 20%, rgba(255,43,214,.22), transparent 35%),
                radial-gradient(circle at 50% 90%, rgba(0,240,255,.12), transparent 40%);
            animation: neonPulse 8s ease-in-out infinite alternate;
        }
        @keyframes neonPulse { to { transform: scale(1.08); filter: hue-rotate(20deg); } }
        .layout-neon .n-hero-inner { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; width: 100%; }
        .layout-neon .n-tag {
            display: inline-block; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
            color: #00f0ff; border: 1px solid #00f0ff; padding: 6px 12px; margin-bottom: 18px;
            box-shadow: 0 0 20px rgba(0,240,255,.35);
        }
        .layout-neon .n-title {
            font-family: Syne, sans-serif; font-size: clamp(3rem, 10vw, 6rem); line-height: .95;
            margin: 0 0 12px; text-transform: uppercase; letter-spacing: -.03em;
            text-shadow: 0 0 40px rgba(255,43,214,.35);
        }
        .layout-neon .n-sub { color: #94a3b8; margin: 0 0 28px; font-size: 1.05rem; }
        .layout-neon .n-big {
            display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap;
        }
        .layout-neon .n-pct {
            font-family: Syne, sans-serif; font-size: clamp(5rem, 16vw, 9rem); line-height: .85;
            background: linear-gradient(120deg, #00f0ff, #ff2bd6); -webkit-background-clip: text;
            background-clip: text; color: transparent; font-weight: 800;
        }
        .layout-neon .n-pct-meta { padding-bottom: 12px; color: #94a3b8; }
        .layout-neon .n-strip {
            max-width: 980px; margin: 0 auto; padding: 0 24px 80px;
        }
        .layout-neon .n-row {
            display: grid; grid-template-columns: 140px 1fr; gap: 16px; align-items: stretch;
            border: 1px solid rgba(0,240,255,.2); margin-top: 14px;
            background: rgba(0,0,0,.45);
        }
        .layout-neon .n-row-label {
            writing-mode: vertical-rl; transform: rotate(180deg);
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
            background: linear-gradient(180deg, rgba(0,240,255,.15), rgba(255,43,214,.15));
            color: #00f0ff; padding: 16px 8px; border-right: 1px solid rgba(0,240,255,.2);
        }
        .layout-neon .n-row-body { padding: 18px 20px; }
        .layout-neon .n-bar {
            height: 4px; background: #1e1e2a; margin: 10px 0 0; overflow: hidden;
        }
        .layout-neon .n-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#00f0ff,#ff2bd6); box-shadow: 0 0 12px #00f0ff; }
        .layout-neon .n-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .layout-neon .n-chip {
            border: 1px solid rgba(255,43,214,.45); color: #ff2bd6; padding: 8px 12px;
            font-size: 13px; border-radius: 999px; box-shadow: 0 0 14px rgba(255,43,214,.2);
        }
        .layout-neon .n-list { list-style: none; margin: 0; padding: 0; }
        .layout-neon .n-list li {
            display: flex; justify-content: space-between; gap: 12px;
            padding: 10px 0; border-bottom: 1px dashed rgba(0,240,255,.2); font-size: 14px;
        }
        .layout-neon .n-search {
            display: flex; gap: 0; border: 1px solid #00f0ff; box-shadow: 0 0 24px rgba(0,240,255,.2);
        }
        .layout-neon .n-search input {
            flex: 1; border: 0; background: #000; color: #fff; padding: 14px 16px; font: inherit; outline: none;
        }
        .layout-neon .n-search button {
            border: 0; background: linear-gradient(90deg,#00f0ff,#ff2bd6); color: #000;
            font-weight: 800; padding: 0 18px; cursor: pointer; text-transform: uppercase; letter-spacing: .06em;
        }
        .layout-neon .n-chart { display: flex; align-items: flex-end; gap: 3px; height: 90px; margin-top: 12px; }
        .layout-neon .n-chart span {
            flex: 1; background: rgba(0,240,255,.15); border-radius: 2px 2px 0 0;
        }
        .layout-neon .n-chart span.on { background: linear-gradient(180deg,#ff2bd6,#00f0ff); box-shadow: 0 0 10px rgba(255,43,214,.4); }
        @media (max-width: 700px) {
            .layout-neon .n-row { grid-template-columns: 1fr; }
            .layout-neon .n-row-label {
                writing-mode: horizontal-tb; transform: none; border-right: 0;
                border-bottom: 1px solid rgba(0,240,255,.2); padding: 10px 14px;
            }
        }

        /* ========== 2. NEBULA — bento asymmetric ========== */
        .layout-nebula {
            font-family: Outfit, sans-serif;
            background: #06041a; color: #f5f0ff; min-height: 100vh;
            padding: 28px 18px 100px;
        }
        .layout-nebula .nb-wrap { max-width: 1100px; margin: 0 auto; }
        .layout-nebula .nb-head { margin-bottom: 22px; }
        .layout-nebula .nb-kicker {
            color: #a78bfa; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px;
        }
        .layout-nebula .nb-title {
            font-family: Syne, sans-serif; font-size: clamp(2.2rem, 6vw, 3.8rem);
            margin: 0 0 8px; line-height: 1.05;
        }
        .layout-nebula .nb-sub { color: #a89bc8; margin: 0; }
        .layout-nebula .nb-bento {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            grid-template-rows: auto auto auto;
            gap: 12px;
        }
        .layout-nebula .nb-tile {
            background: linear-gradient(160deg, rgba(167,139,250,.16), rgba(56,189,248,.06));
            border: 1px solid rgba(167,139,250,.28);
            border-radius: 28px; padding: 22px;
            box-shadow: 0 0 40px rgba(124,58,237,.12);
            position: relative; overflow: hidden;
        }
        .layout-nebula .nb-tile::after {
            content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%;
            right: -40px; top: -40px;
            background: radial-gradient(circle, rgba(56,189,248,.25), transparent 70%);
            pointer-events: none;
        }
        .layout-nebula .nb-tile.wide { grid-column: span 2; }
        .layout-nebula .nb-tile.tall { grid-row: span 2; }
        .layout-nebula .nb-tile.full { grid-column: 1 / -1; }
        .layout-nebula .nb-h {
            font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #a89bc8; margin: 0 0 14px;
        }
        .layout-nebula .nb-mega {
            font-family: Syne, sans-serif; font-size: clamp(4rem, 12vw, 7rem); margin: 0; line-height: .9;
            background: linear-gradient(120deg, #c4b5fd, #38bdf8); -webkit-background-clip: text;
            background-clip: text; color: transparent;
        }
        .layout-nebula .nb-ring {
            width: 160px; height: 160px; border-radius: 50%; margin: 8px auto;
            display: grid; place-items: center; position: relative;
        }
        .layout-nebula .nb-ring::after {
            content: ''; position: absolute; inset: 18px; border-radius: 50%; background: #100b2a;
            border: 1px solid rgba(167,139,250,.25);
        }
        .layout-nebula .nb-ring strong {
            position: relative; z-index: 1; font-size: 2rem; font-family: Syne, sans-serif;
        }
        .layout-nebula .nb-status {
            display: flex; flex-direction: column; gap: 10px;
        }
        .layout-nebula .nb-status-row {
            display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 14px;
        }
        .layout-nebula .nb-track { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; grid-column: 1 / -1; }
        .layout-nebula .nb-track > i { display: block; height: 100%; background: linear-gradient(90deg,#7c3aed,#38bdf8); width: 0; }
        .layout-nebula .nb-tasks { display: flex; flex-direction: column; gap: 10px; max-height: 320px; overflow: auto; }
        .layout-nebula .nb-task {
            display: flex; gap: 10px; align-items: flex-start; padding: 12px;
            border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
        }
        .layout-nebula .nb-check {
            width: 20px; height: 20px; border-radius: 50%; border: 1px solid #a78bfa; flex-shrink: 0;
            display: grid; place-items: center; font-size: 11px;
        }
        .layout-nebula .nb-check.on { background: #a78bfa; color: #100b2a; }
        .layout-nebula .nb-search {
            display: flex; gap: 10px; align-items: center;
        }
        .layout-nebula .nb-search input {
            flex: 1; height: 48px; border-radius: 999px; border: 1px solid rgba(167,139,250,.4);
            background: rgba(0,0,0,.25); color: #fff; padding: 0 18px; font: inherit; outline: none;
        }
        .layout-nebula .nb-search button {
            height: 48px; border-radius: 999px; border: 0; padding: 0 20px; cursor: pointer;
            background: linear-gradient(90deg,#7c3aed,#38bdf8); color: #fff; font-weight: 700;
        }
        .layout-nebula .nb-chart { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
        .layout-nebula .nb-chart i {
            flex: 1; border-radius: 8px 8px 0 0; background: rgba(167,139,250,.2); display: block;
        }
        .layout-nebula .nb-chart i.on { background: linear-gradient(180deg,#c4b5fd,#6366f1); }
        .layout-nebula .nb-feed { display: flex; flex-direction: column; gap: 8px; }
        .layout-nebula .nb-feed div {
            font-size: 14px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.04);
        }
        .layout-nebula .nb-feed time { display: block; color: #a89bc8; font-size: 11px; margin-top: 3px; }
        @media (max-width: 900px) {
            .layout-nebula .nb-bento { grid-template-columns: 1fr 1fr; }
            .layout-nebula .nb-tile.wide, .layout-nebula .nb-tile.tall { grid-column: span 2; grid-row: auto; }
        }
        @media (max-width: 560px) {
            .layout-nebula .nb-bento { grid-template-columns: 1fr; }
            .layout-nebula .nb-tile.wide, .layout-nebula .nb-tile.tall, .layout-nebula .nb-tile.full { grid-column: auto; }
        }

        /* ========== 3. RADIANT — editorial magazine ========== */
        .layout-radiant {
            font-family: Outfit, sans-serif;
            background: #12080c; color: #fff7f2; min-height: 100vh;
        }
        .layout-radiant .r-top {
            padding: 28px 20px 0; max-width: 820px; margin: 0 auto;
        }
        .layout-radiant .r-issue {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #c4a399;
            border-bottom: 1px solid rgba(251,146,60,.35); padding-bottom: 12px; margin-bottom: 28px;
        }
        .layout-radiant .r-title {
            font-family: Syne, sans-serif; font-size: clamp(2.8rem, 8vw, 4.8rem);
            line-height: .98; margin: 0 0 10px; letter-spacing: -.03em;
        }
        .layout-radiant .r-title em {
            font-style: normal;
            background: linear-gradient(90deg,#fb923c,#f43f5e,#d946ef);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .layout-radiant .r-dek { color: #c4a399; font-size: 1.15rem; margin: 0 0 28px; max-width: 34rem; }
        .layout-radiant .r-marquee {
            overflow: hidden; border-block: 1px solid rgba(251,146,60,.35);
            background: rgba(251,146,60,.08); margin-bottom: 28px;
        }
        .layout-radiant .r-marquee-track {
            display: flex; gap: 32px; white-space: nowrap; padding: 12px 0;
            animation: rMarquee 22s linear infinite; width: max-content;
            font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #fb923c;
        }
        @keyframes rMarquee { to { transform: translateX(-50%); } }
        .layout-radiant .r-main {
            max-width: 820px; margin: 0 auto; padding: 0 20px 100px;
            display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px;
        }
        .layout-radiant .r-col-left { border-right: 1px solid rgba(255,255,255,.08); padding-right: 24px; }
        .layout-radiant .r-section { margin-bottom: 28px; }
        .layout-radiant .r-h {
            font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
            color: #f43f5e; margin: 0 0 12px; font-weight: 700;
        }
        .layout-radiant .r-progress-num {
            font-family: Syne, sans-serif; font-size: 5rem; margin: 0; line-height: 1;
            background: linear-gradient(90deg,#fb923c,#f43f5e); -webkit-background-clip: text;
            background-clip: text; color: transparent;
        }
        .layout-radiant .r-line {
            height: 3px; background: rgba(255,255,255,.08); margin: 12px 0 8px; overflow: hidden;
        }
        .layout-radiant .r-line > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#fb923c,#d946ef); }
        .layout-radiant .r-task {
            padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .layout-radiant .r-task strong { display: block; font-size: 1.05rem; margin-bottom: 4px; }
        .layout-radiant .r-task span { color: #c4a399; font-size: 13px; }
        .layout-radiant .r-task.done strong { text-decoration: line-through; color: #c4a399; }
        .layout-radiant .r-aside-card {
            background: linear-gradient(160deg, rgba(251,146,60,.14), rgba(244,63,94,.08));
            border: 1px solid rgba(251,146,60,.3); border-radius: 4px; padding: 18px; margin-bottom: 16px;
        }
        .layout-radiant .r-search input {
            width: 100%; height: 44px; border: 0; border-bottom: 2px solid #fb923c;
            background: transparent; color: #fff; font: inherit; outline: none; margin-bottom: 10px;
        }
        .layout-radiant .r-search button {
            width: 100%; height: 42px; border: 0; cursor: pointer; font-weight: 700;
            background: linear-gradient(90deg,#fb923c,#f43f5e); color: #1a0a0c;
        }
        .layout-radiant .r-chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; }
        .layout-radiant .r-chart i { flex: 1; display: block; background: rgba(251,146,60,.2); }
        .layout-radiant .r-chart i.on { background: linear-gradient(180deg,#fb7185,#fb923c); }
        .layout-radiant .r-feed article {
            padding: 10px 0; border-bottom: 1px dotted rgba(255,255,255,.15); font-size: 14px;
        }
        .layout-radiant .r-feed time { color: #c4a399; font-size: 11px; }
        @media (max-width: 760px) {
            .layout-radiant .r-main { grid-template-columns: 1fr; }
            .layout-radiant .r-col-left { border-right: 0; padding-right: 0; }
        }

        /* ========== 4. LUMEN — light minimal editorial ========== */
        .layout-lumen {
            font-family: Outfit, sans-serif;
            background: #f4f0e8; color: #171412; min-height: 100vh;
        }
        .layout-lumen .l-shell { max-width: 720px; margin: 0 auto; padding: 48px 22px 120px; }
        .layout-lumen .l-brand {
            font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #6b645c; margin-bottom: 32px;
        }
        .layout-lumen .l-title {
            font-family: "Instrument Serif", Georgia, serif;
            font-size: clamp(2.8rem, 8vw, 4.4rem); font-weight: 400; line-height: 1.05;
            margin: 0 0 14px; letter-spacing: -.02em;
        }
        .layout-lumen .l-sub { color: #6b645c; font-size: 1.1rem; margin: 0 0 40px; line-height: 1.5; }
        .layout-lumen .l-hero-stat {
            display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
            padding: 28px 0; border-top: 1px solid #d9d2c5; border-bottom: 1px solid #d9d2c5;
            margin-bottom: 40px;
        }
        .layout-lumen .l-pct {
            font-family: "Instrument Serif", Georgia, serif; font-size: 5.5rem; line-height: .9; margin: 0;
            color: #b45309;
        }
        .layout-lumen .l-pct-note { color: #6b645c; text-align: right; max-width: 12rem; }
        .layout-lumen .l-block { margin-bottom: 42px; }
        .layout-lumen .l-h {
            font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
            color: #6b645c; margin: 0 0 16px; font-weight: 600;
        }
        .layout-lumen .l-rule { height: 1px; background: #d9d2c5; margin: 0 0 16px; position: relative; }
        .layout-lumen .l-rule > i {
            position: absolute; left: 0; top: 0; height: 100%; width: 0; background: #b45309;
        }
        .layout-lumen .l-status {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
        }
        .layout-lumen .l-status div {
            background: #fff; border: 1px solid #e5dfd3; padding: 16px 18px;
        }
        .layout-lumen .l-status strong { display: block; font-size: 1.6rem; font-family: "Instrument Serif", Georgia, serif; }
        .layout-lumen .l-status span { color: #6b645c; font-size: 13px; }
        .layout-lumen .l-site {
            background: #fff; border: 1px solid #e5dfd3; padding: 22px;
        }
        .layout-lumen .l-site form { display: flex; gap: 8px; margin: 12px 0; }
        .layout-lumen .l-site input {
            flex: 1; height: 44px; border: 1px solid #d9d2c5; background: #faf7f2;
            padding: 0 14px; font: inherit; color: #171412; outline: none;
        }
        .layout-lumen .l-site button {
            height: 44px; padding: 0 18px; border: 0; background: #171412; color: #f4f0e8;
            font-weight: 600; cursor: pointer;
        }
        .layout-lumen .l-weeks {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-items: end; height: 120px;
        }
        .layout-lumen .l-weeks > div {
            background: #e5dfd3; border-radius: 2px 2px 0 0; position: relative;
        }
        .layout-lumen .l-weeks > div.on { background: #0f766e; }
        .layout-lumen .l-task {
            display: grid; grid-template-columns: 28px 1fr; gap: 12px;
            padding: 14px 0; border-bottom: 1px solid #e5dfd3;
        }
        .layout-lumen .l-dot {
            width: 18px; height: 18px; border: 1px solid #b45309; border-radius: 50%; margin-top: 3px;
            display: grid; place-items: center; font-size: 10px;
        }
        .layout-lumen .l-dot.on { background: #b45309; color: #fff; }
        .layout-lumen .l-task.done .name { text-decoration: line-through; color: #6b645c; }
        .layout-lumen .l-feed { border-left: 2px solid #d9d2c5; padding-left: 16px; }
        .layout-lumen .l-feed p { margin: 0 0 14px; font-size: 15px; }
        .layout-lumen .l-feed time { color: #6b645c; font-size: 12px; }
        .layout-lumen .l-chart-mini {
            display: flex; align-items: flex-end; gap: 2px; height: 70px; margin-top: 12px;
        }
        .layout-lumen .l-chart-mini i { flex: 1; display: block; background: #e5dfd3; }
        .layout-lumen .l-chart-mini i.on { background: #b45309; }
        @media (max-width: 520px) {
            .layout-lumen .l-status { grid-template-columns: 1fr; }
            .layout-lumen .l-site form { flex-direction: column; }
        }

        /* ========== 5. DATACORE — dashboard shell ========== */
        .layout-datacore {
            font-family: "IBM Plex Sans", system-ui, sans-serif;
            background: #0a1018; color: #e8eef5; min-height: 100vh;
        }
        .layout-datacore .d-shell {
            display: grid; grid-template-columns: 240px 1fr; min-height: 100vh;
        }
        .layout-datacore .d-side {
            border-right: 1px solid rgba(45,212,191,.2); background: #0d1520;
            padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow: auto;
        }
        .layout-datacore .d-logo {
            font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .14em;
            color: #2dd4bf; margin-bottom: 24px; text-transform: uppercase;
        }
        .layout-datacore .d-nav a {
            display: block; padding: 10px 12px; margin-bottom: 4px; border-radius: 8px;
            color: #7d8fa3; text-decoration: none; font-size: 13px; border: 1px solid transparent;
        }
        .layout-datacore .d-nav a:hover, .layout-datacore .d-nav a.on {
            color: #e8eef5; background: rgba(45,212,191,.08); border-color: rgba(45,212,191,.25);
        }
        .layout-datacore .d-side-metric {
            margin-top: 24px; padding: 14px; border: 1px solid rgba(45,212,191,.25);
            border-radius: 10px; background: rgba(45,212,191,.05);
        }
        .layout-datacore .d-side-metric b {
            display: block; font-family: "IBM Plex Mono", monospace; font-size: 2rem; color: #2dd4bf;
        }
        .layout-datacore .d-main { padding: 22px 22px 100px; }
        .layout-datacore .d-head {
            display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
            margin-bottom: 18px; align-items: flex-end;
        }
        .layout-datacore .d-head h1 {
            margin: 0; font-size: 1.5rem; font-weight: 600;
        }
        .layout-datacore .d-head p { margin: 4px 0 0; color: #7d8fa3; font-size: 13px; }
        .layout-datacore .d-badge {
            font-family: "IBM Plex Mono", monospace; font-size: 11px; color: #2dd4bf;
            border: 1px solid rgba(45,212,191,.4); padding: 6px 10px; border-radius: 6px;
        }
        .layout-datacore .d-kpis {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px;
        }
        .layout-datacore .d-kpi {
            background: #111a24; border: 1px solid rgba(56,189,248,.18); border-radius: 10px; padding: 14px;
        }
        .layout-datacore .d-kpi span {
            display: block; font-size: 11px; color: #7d8fa3; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px;
        }
        .layout-datacore .d-kpi strong {
            font-family: "IBM Plex Mono", monospace; font-size: 1.5rem; font-weight: 500;
        }
        .layout-datacore .d-grid2 {
            display: grid; grid-template-columns: 1.2fr .8fr; gap: 10px; margin-bottom: 10px;
        }
        .layout-datacore .d-panel {
            background: #111a24; border: 1px solid rgba(56,189,248,.16); border-radius: 10px; padding: 14px;
        }
        .layout-datacore .d-panel h2 {
            margin: 0 0 12px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
            color: #7d8fa3; font-weight: 600;
        }
        .layout-datacore .d-bar {
            height: 6px; background: #1a2633; border-radius: 99px; overflow: hidden; margin-top: 8px;
        }
        .layout-datacore .d-bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#2dd4bf,#38bdf8); }
        .layout-datacore .d-chart { display: flex; align-items: flex-end; gap: 2px; height: 110px; }
        .layout-datacore .d-chart i { flex: 1; display: block; background: rgba(45,212,191,.15); border-radius: 2px 2px 0 0; }
        .layout-datacore .d-chart i.on { background: linear-gradient(180deg,#67e8f9,#0d9488); }
        .layout-datacore table {
            width: 100%; border-collapse: collapse; font-size: 13px;
        }
        .layout-datacore th, .layout-datacore td {
            text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .layout-datacore th {
            color: #7d8fa3; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
        }
        .layout-datacore .ok { color: #4ade80; }
        .layout-datacore .wait { color: #fbbf24; }
        .layout-datacore .d-search {
            display: grid; grid-template-columns: 1fr auto; gap: 8px;
        }
        .layout-datacore .d-search input {
            height: 40px; border-radius: 8px; border: 1px solid rgba(45,212,191,.3);
            background: #0a1018; color: #e8eef5; padding: 0 12px; font: inherit; outline: none;
            font-family: "IBM Plex Mono", monospace; font-size: 12px;
        }
        .layout-datacore .d-search button {
            height: 40px; border-radius: 8px; border: 0; padding: 0 14px; cursor: pointer;
            background: #2dd4bf; color: #042f2e; font-weight: 700; font-size: 12px;
        }
        .layout-datacore .d-msg { font-size: 12px; margin-top: 8px; color: #7d8fa3; min-height: 1.2em; }
        .layout-datacore .d-msg.ok { color: #4ade80; }
        .layout-datacore .d-msg.err { color: #f87171; }
        .layout-datacore .d-feed { font-size: 13px; }
        .layout-datacore .d-feed div {
            padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.05);
            font-family: "IBM Plex Mono", monospace; font-size: 12px;
        }
        @media (max-width: 900px) {
            .layout-datacore .d-shell { grid-template-columns: 1fr; }
            .layout-datacore .d-side { position: relative; height: auto; border-right: 0; border-bottom: 1px solid rgba(45,212,191,.2); }
            .layout-datacore .d-kpis { grid-template-columns: 1fr 1fr; }
            .layout-datacore .d-grid2 { grid-template-columns: 1fr; }
        }

        .msg-ok { color: #4ade80 !important; }
        .msg-err { color: #f87171 !important; }
        [data-layout="lumen"] .msg-ok { color: #15803d !important; }
        [data-layout="lumen"] .msg-err { color: #b91c1c !important; }
    </style>
</head>
<body data-layout="neon">
    <div id="app"><p class="cp-loading">Загрузка кабинета…</p></div>
    <div class="cp-theme-bar" id="cpThemeBar" hidden>
        <div class="hint">Варианты вёрстки · MotionSites</div>
        <button type="button" data-theme-pick="neon">Neon</button>
        <button type="button" data-theme-pick="nebula">Nebula</button>
        <button type="button" data-theme-pick="radiant">Radiant</button>
        <button type="button" data-theme-pick="lumen">Lumen</button>
        <button type="button" data-theme-pick="datacore">Datacore</button>
    </div>
    <script>
    (async function () {
        const THEMES = ['neon', 'nebula', 'radiant', 'lumen', 'datacore'];
        const root = document.getElementById('app');
        const params = new URLSearchParams(location.search);
        const token = (params.get('t') || params.get('token') || '').trim();
        const isPreview = params.get('preview') === '1';
        let theme = String(params.get('theme') || localStorage.getItem('cp_theme') || 'neon').toLowerCase();
        if (!THEMES.includes(theme)) theme = 'neon';

        const themeBar = document.getElementById('cpThemeBar');
        if (isPreview || params.get('picker') === '1') {
            themeBar.hidden = false;
            const paintActive = () => {
                themeBar.querySelectorAll('[data-theme-pick]').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-theme-pick') === theme);
                });
            };
            paintActive();
            themeBar.querySelectorAll('[data-theme-pick]').forEach(btn => {
                btn.addEventListener('click', () => {
                    theme = btn.getAttribute('data-theme-pick');
                    localStorage.setItem('cp_theme', theme);
                    const url = new URL(location.href);
                    url.searchParams.set('theme', theme);
                    history.replaceState(null, '', url.toString());
                    paintActive();
                    if (window.__cpData) render(window.__cpData);
                });
            });
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }
        function fmtDay(d) {
            if (!d) return '';
            const p = String(d).slice(0, 10).split('-');
            return p.length < 3 ? d : (p[2] + '.' + p[1]);
        }
        function fmtWhen(iso) {
            if (!iso) return '';
            try {
                const x = new Date(iso);
                const p = n => String(n).padStart(2, '0');
                return p(x.getDate()) + '.' + p(x.getMonth() + 1) + ' ' + p(x.getHours()) + ':' + p(x.getMinutes());
            } catch (e) { return iso; }
        }
        function actLabel(a) {
            if (a.action === 'complete_task') return 'Готово: ' + (a.details || 'задача');
            if (a.action === 'create_task') return 'Добавлен этап: ' + (a.details || '');
            if (a.action === 'change_status') return 'Статус: ' + (a.details || '');
            return a.details || a.action;
        }
        function statusCounts(tasks) {
            const map = new Map();
            tasks.forEach(t => {
                const key = t.done ? 'Готово' : (t.status || 'Ожидает');
                map.set(key, (map.get(key) || 0) + 1);
            });
            return Array.from(map.entries()).map(([name, count]) => ({ name, count }));
        }
        function weekBuckets(activity) {
            const weeks = [];
            const now = new Date();
            now.setHours(12, 0, 0, 0);
            for (let i = 5; i >= 0; i--) {
                const end = new Date(now);
                end.setDate(now.getDate() - i * 7);
                const start = new Date(end);
                start.setDate(end.getDate() - 6);
                weeks.push({
                    label: fmtDay(start.toISOString().slice(0, 10)) + '–' + fmtDay(end.toISOString().slice(0, 10)),
                    start: start.getTime(),
                    end: end.getTime() + 86400000 - 1,
                    count: 0
                });
            }
            (activity || []).forEach(a => {
                if (a.action !== 'complete_task') return;
                const t = new Date(a.created_at).getTime();
                if (!t) return;
                const w = weeks.find(x => t >= x.start && t <= x.end);
                if (w) w.count += 1;
            });
            return weeks;
        }
        function bars(items, getCount, cls, onCls) {
            const max = Math.max(1, ...items.map(getCount));
            return items.map(it => {
                const c = getCount(it);
                const h = c ? Math.max(8, Math.round((c / max) * 100)) : 4;
                return `<${cls} class="${c ? onCls : ''}" style="height:${h}%" title="${esc(it.label || it.day || '')}: ${c}"></${cls}>`;
            }).join('');
        }

        function bindSite(token) {
            const input = document.getElementById('cpSiteUrl');
            const btn = document.getElementById('cpSiteSave');
            const msg = document.getElementById('cpSiteMsg');
            const cur = document.getElementById('cpSiteCurrent');
            async function save() {
                if (!msg) return;
                msg.className = 'd-msg cp-site-msg';
                msg.textContent = 'Сохраняем…';
                try {
                    const r = await fetch('/api/public/client/' + encodeURIComponent(token) + '/site', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ site_url: (input && input.value || '').trim() })
                    });
                    const j = await r.json();
                    if (!r.ok) throw new Error(j.error || 'Ошибка');
                    if (input) input.value = j.site_url || '';
                    if (cur) {
                        cur.innerHTML = j.site_url
                            ? 'Сейчас: <a href="' + esc(j.site_url) + '" target="_blank" rel="noopener">' + esc(j.site_url) + '</a>'
                            : 'Сайт ещё не указан';
                    }
                    msg.className = 'd-msg cp-site-msg msg-ok';
                    msg.textContent = j.site_url ? 'Сайт сохранён' : 'Адрес очищен';
                } catch (e) {
                    msg.className = 'd-msg cp-site-msg msg-err';
                    msg.textContent = e.message || 'Ошибка';
                }
            }
            if (btn) btn.addEventListener('click', save);
            if (input) input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); save(); } });
        }

        function animateBars(sel, attr) {
            if (!window.gsap) {
                document.querySelectorAll(sel).forEach(el => {
                    el.style.width = (el.getAttribute(attr) || '0') + '%';
                });
                return;
            }
            document.querySelectorAll(sel).forEach(el => {
                gsap.to(el, { width: (el.getAttribute(attr) || '0') + '%', duration: 1.1, ease: 'power2.out', delay: 0.2 });
            });
        }

        function renderNeon(ctx) {
            const { p, pct, done, total, byStatus, weeks, tasks, acts, docs, showVisits, visits, visitsTotal, siteUrl } = ctx;
            const maxS = Math.max(1, ...byStatus.map(s => s.count));
            return `
            <div class="layout-neon">
                <section class="n-hero">
                    <div class="n-hero-inner">
                        <div class="n-tag">Neon · клиентский кабинет${ctx.isPreview ? ' · preview' : ''}</div>
                        <h1 class="n-title">${esc(p.name || 'Проект')}</h1>
                        <p class="n-sub">${esc(p.client || '')}${p.status ? ' · ' + esc(p.status) : ''}${p.deadline ? ' · до ' + esc(p.deadline) : ''}</p>
                        <div class="n-big">
                            <div class="n-pct" id="cpPctNum">${pct}%</div>
                            <div class="n-pct-meta">готовность<br>${done} / ${total} этапов</div>
                        </div>
                        <div class="n-bar" style="margin-top:18px;max-width:420px;"><i data-w="${pct}" class="fill-anim"></i></div>
                    </div>
                </section>
                <div class="n-strip">
                    <div class="n-row">
                        <div class="n-row-label">Статусы</div>
                        <div class="n-row-body">
                            <div class="n-chips">
                                ${byStatus.map(s => `<span class="n-chip">${esc(s.name)} · ${s.count}</span>`).join('') || '<span class="n-chip">Нет данных</span>'}
                            </div>
                            ${byStatus.map(s => `
                                <div style="margin-top:10px;font-size:12px;color:#94a3b8;">${esc(s.name)}</div>
                                <div class="n-bar"><i class="fill-anim" data-w="${Math.round((s.count/maxS)*100)}"></i></div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="n-row">
                        <div class="n-row-label">Сайт</div>
                        <div class="n-row-body">
                            <div class="n-search">
                                <input id="cpSiteUrl" placeholder="https://ваш-сайт.ru" value="${esc(siteUrl)}">
                                <button type="button" id="cpSiteSave">Save</button>
                            </div>
                            <div id="cpSiteMsg" style="margin-top:8px;font-size:13px;min-height:1.2em;"></div>
                            <div id="cpSiteCurrent" style="margin-top:6px;font-size:13px;color:#94a3b8;">${siteUrl ? 'Сейчас: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener" style="color:#00f0ff">'+esc(siteUrl)+'</a>' : 'Сайт ещё не указан'}</div>
                            <div style="margin-top:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#00f0ff;">Заходы · 30 дней</div>
                            ${showVisits ? `
                                <div style="font-size:13px;color:#94a3b8;margin:6px 0;">Всего: <b style="color:#fff">${visitsTotal}</b></div>
                                <div class="n-chart">${visits.map(v => {
                                    const maxV = Math.max(1, ...visits.map(x => x.count));
                                    const h = v.count ? Math.max(8, Math.round((v.count/maxV)*100)) : 4;
                                    return `<span class="${v.count?'on':''}" style="height:${h}%"></span>`;
                                }).join('')}</div>
                            ` : '<p style="color:#94a3b8;font-size:13px;">Статистика выключена</p>'}
                        </div>
                    </div>
                    <div class="n-row">
                        <div class="n-row-label">Этапы</div>
                        <div class="n-row-body">
                            <ul class="n-list">
                                ${tasks.map(t => `<li><span>${t.done?'✓ ':''}${esc(t.name)}</span><span style="color:#94a3b8">${esc(t.status)}</span></li>`).join('') || '<li>Нет этапов</li>'}
                            </ul>
                        </div>
                    </div>
                    <div class="n-row">
                        <div class="n-row-label">Недели</div>
                        <div class="n-row-body">
                            <div class="n-chart">${weeks.map(w => {
                                const maxW = Math.max(1, ...weeks.map(x => x.count));
                                const h = w.count ? Math.max(10, Math.round((w.count/maxW)*100)) : 4;
                                return `<span class="${w.count?'on':''}" style="height:${h}%" title="${esc(w.label)}: ${w.count}"></span>`;
                            }).join('')}</div>
                        </div>
                    </div>
                    ${acts.length ? `
                    <div class="n-row">
                        <div class="n-row-label">Лента</div>
                        <div class="n-row-body">
                            <ul class="n-list">${acts.slice(0,12).map(a => `<li><span>${esc(actLabel(a))}</span><span style="color:#94a3b8">${esc(fmtWhen(a.created_at))}</span></li>`).join('')}</ul>
                        </div>
                    </div>` : ''}
                    ${docs.length ? `
                    <div class="n-row">
                        <div class="n-row-label">Docs</div>
                        <div class="n-row-body">
                            <ul class="n-list">${docs.map(d => `<li><span>${esc(d.name)}</span><span style="color:#94a3b8">${esc(d.type||'')}</span></li>`).join('')}</ul>
                        </div>
                    </div>` : ''}
                </div>
            </div>`;
        }

        function renderNebula(ctx) {
            const { p, pct, done, total, left, byStatus, weeks, tasks, acts, docs, showVisits, visits, visitsTotal, siteUrl } = ctx;
            const maxS = Math.max(1, ...byStatus.map(s => s.count));
            const donut = `conic-gradient(#a78bfa 0 ${pct}%, rgba(255,255,255,.08) ${pct}% 100%)`;
            return `
            <div class="layout-nebula">
                <div class="nb-wrap">
                    <header class="nb-head">
                        <div class="nb-kicker">Nebula Glow · кабинет${ctx.isPreview ? ' · preview' : ''}</div>
                        <h1 class="nb-title">${esc(p.name || 'Проект')}</h1>
                        <p class="nb-sub">${esc(p.client || '')}${p.status ? ' · ' + esc(p.status) : ''}${p.deadline ? ' · до ' + esc(p.deadline) : ''}</p>
                    </header>
                    <div class="nb-bento">
                        <div class="nb-tile tall">
                            <div class="nb-h">Готовность</div>
                            <div class="nb-mega" id="cpPctNum">${pct}%</div>
                            <p style="color:#a89bc8;margin:12px 0 0;">${done} из ${total} этапов · осталось ${left}</p>
                            <div class="nb-track" style="margin-top:18px;"><i class="fill-anim" data-w="${pct}"></i></div>
                        </div>
                        <div class="nb-tile">
                            <div class="nb-h">Кольцо</div>
                            <div class="nb-ring" style="background:${donut}"><strong>${pct}%</strong></div>
                        </div>
                        <div class="nb-tile">
                            <div class="nb-h">Статусы</div>
                            <div class="nb-status">
                                ${byStatus.map(s => `
                                    <div class="nb-status-row"><span>${esc(s.name)}</span><b>${s.count}</b>
                                    <div class="nb-track"><i class="fill-anim" data-w="${Math.round((s.count/maxS)*100)}"></i></div></div>
                                `).join('') || '<div style="color:#a89bc8">Нет данных</div>'}
                            </div>
                        </div>
                        <div class="nb-tile wide">
                            <div class="nb-h">Мой сайт</div>
                            <div class="nb-search">
                                <input id="cpSiteUrl" placeholder="https://ваш-сайт.ru" value="${esc(siteUrl)}">
                                <button type="button" id="cpSiteSave">Сохранить</button>
                            </div>
                            <div id="cpSiteMsg" style="margin-top:8px;font-size:13px;min-height:1.2em;"></div>
                            <div id="cpSiteCurrent" style="margin-top:8px;font-size:13px;color:#a89bc8;">${siteUrl ? 'Сейчас: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener" style="color:#38bdf8">'+esc(siteUrl)+'</a>' : 'Сайт ещё не указан'}</div>
                        </div>
                        <div class="nb-tile">
                            <div class="nb-h">Заходы 30д</div>
                            ${showVisits ? `
                                <div style="font-size:13px;color:#a89bc8;margin-bottom:8px;">Всего <b style="color:#fff">${visitsTotal}</b></div>
                                <div class="nb-chart">${visits.map(v => {
                                    const maxV = Math.max(1, ...visits.map(x => x.count));
                                    const h = v.count ? Math.max(8, Math.round((v.count/maxV)*100)) : 4;
                                    return `<i class="${v.count?'on':''}" style="height:${h}%"></i>`;
                                }).join('')}</div>
                            ` : '<p style="color:#a89bc8;margin:0;font-size:13px;">Выключено</p>'}
                        </div>
                        <div class="nb-tile tall">
                            <div class="nb-h">Этапы</div>
                            <div class="nb-tasks">
                                ${tasks.map(t => `
                                    <div class="nb-task">
                                        <div class="nb-check ${t.done?'on':''}">${t.done?'✓':''}</div>
                                        <div><div style="font-weight:600">${esc(t.name)}</div><div style="font-size:12px;color:#a89bc8">${esc(t.status)}</div></div>
                                    </div>
                                `).join('') || '<div style="color:#a89bc8">Нет этапов</div>'}
                            </div>
                        </div>
                        <div class="nb-tile">
                            <div class="nb-h">По неделям</div>
                            <div class="nb-chart">${weeks.map(w => {
                                const maxW = Math.max(1, ...weeks.map(x => x.count));
                                const h = w.count ? Math.max(10, Math.round((w.count/maxW)*100)) : 4;
                                return `<i class="${w.count?'on':''}" style="height:${h}%"></i>`;
                            }).join('')}</div>
                        </div>
                        ${acts.length ? `
                        <div class="nb-tile wide">
                            <div class="nb-h">Что сделано</div>
                            <div class="nb-feed">${acts.slice(0,8).map(a => `<div>${esc(actLabel(a))}<time>${esc(fmtWhen(a.created_at))}</time></div>`).join('')}</div>
                        </div>` : ''}
                        ${docs.length ? `
                        <div class="nb-tile full">
                            <div class="nb-h">Документы</div>
                            <div class="nb-feed">${docs.map(d => `<div>${esc(d.name)} <time>${esc(d.type||'')}</time></div>`).join('')}</div>
                        </div>` : ''}
                    </div>
                </div>
            </div>`;
        }

        function renderRadiant(ctx) {
            const { p, pct, done, total, byStatus, weeks, tasks, acts, docs, showVisits, visits, visitsTotal, siteUrl } = ctx;
            const marquee = (byStatus.length ? byStatus : [{ name: 'В работе', count: 0 }])
                .map(s => `${s.name} · ${s.count}`).join('   ✦   ');
            return `
            <div class="layout-radiant">
                <div class="r-top">
                    <div class="r-issue"><span>Radiant Issue</span><span>${ctx.isPreview ? 'PREVIEW' : 'CLIENT'}</span></div>
                    <h1 class="r-title">Проект <em>${esc(p.name || '')}</em></h1>
                    <p class="r-dek">${esc(p.client || '')}${p.status ? ' — ' + esc(p.status) : ''}${p.deadline ? '. Срок: ' + esc(p.deadline) : ''}.</p>
                </div>
                <div class="r-marquee"><div class="r-marquee-track"><span>${esc(marquee)}   ✦   ${esc(marquee)}   ✦   </span><span>${esc(marquee)}   ✦   ${esc(marquee)}   ✦   </span></div></div>
                <div class="r-main">
                    <div class="r-col-left">
                        <section class="r-section">
                            <div class="r-h">Готовность</div>
                            <div class="r-progress-num" id="cpPctNum">${pct}%</div>
                            <div class="r-line"><i class="fill-anim" data-w="${pct}"></i></div>
                            <div style="color:#c4a399;font-size:14px;">Выполнено ${done} из ${total}</div>
                        </section>
                        <section class="r-section">
                            <div class="r-h">Этапы работ</div>
                            ${tasks.map(t => `
                                <div class="r-task ${t.done?'done':''}">
                                    <strong>${esc(t.name)}</strong>
                                    <span>${esc(t.status)}${t.date ? ' · ' + esc(t.date) : ''}</span>
                                </div>
                            `).join('') || '<p style="color:#c4a399">Нет этапов</p>'}
                        </section>
                        ${acts.length ? `
                        <section class="r-section">
                            <div class="r-h">Хроника</div>
                            <div class="r-feed">${acts.slice(0,10).map(a => `<article>${esc(actLabel(a))}<br><time>${esc(fmtWhen(a.created_at))}</time></article>`).join('')}</div>
                        </section>` : ''}
                    </div>
                    <aside>
                        <div class="r-aside-card r-search">
                            <div class="r-h">Сайт клиента</div>
                            <input id="cpSiteUrl" placeholder="вставьте адрес сайта" value="${esc(siteUrl)}">
                            <button type="button" id="cpSiteSave">Сохранить в кабинет</button>
                            <div id="cpSiteMsg" style="margin-top:8px;font-size:13px;min-height:1.2em;"></div>
                            <div id="cpSiteCurrent" style="margin-top:8px;font-size:13px;color:#c4a399;">${siteUrl ? 'Сейчас: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener" style="color:#fb923c">'+esc(siteUrl)+'</a>' : 'Сайт ещё не указан'}</div>
                        </div>
                        <div class="r-aside-card">
                            <div class="r-h">Заходы · 30 дней</div>
                            ${showVisits ? `
                                <div style="font-size:13px;color:#c4a399;margin-bottom:8px;">Всего ${visitsTotal}</div>
                                <div class="r-chart">${visits.map(v => {
                                    const maxV = Math.max(1, ...visits.map(x => x.count));
                                    const h = v.count ? Math.max(8, Math.round((v.count/maxV)*100)) : 3;
                                    return `<i class="${v.count?'on':''}" style="height:${h}%"></i>`;
                                }).join('')}</div>
                            ` : '<p style="color:#c4a399;margin:0;font-size:13px;">Статистика выключена</p>'}
                        </div>
                        <div class="r-aside-card">
                            <div class="r-h">По неделям</div>
                            <div class="r-chart">${weeks.map(w => {
                                const maxW = Math.max(1, ...weeks.map(x => x.count));
                                const h = w.count ? Math.max(10, Math.round((w.count/maxW)*100)) : 3;
                                return `<i class="${w.count?'on':''}" style="height:${h}%"></i>`;
                            }).join('')}</div>
                        </div>
                        ${docs.length ? `
                        <div class="r-aside-card">
                            <div class="r-h">Документы</div>
                            ${docs.map(d => `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;">${esc(d.name)}</div>`).join('')}
                        </div>` : ''}
                    </aside>
                </div>
            </div>`;
        }

        function renderLumen(ctx) {
            const { p, pct, done, total, left, byStatus, weeks, tasks, acts, docs, showVisits, visits, visitsTotal, siteUrl } = ctx;
            return `
            <div class="layout-lumen">
                <div class="l-shell">
                    <div class="l-brand">Lumen · личный кабинет${ctx.isPreview ? ' · preview' : ''}</div>
                    <h1 class="l-title">${esc(p.name || 'Проект')}</h1>
                    <p class="l-sub">${esc(p.client || 'Клиент')}${p.status ? '. Статус: ' + esc(p.status) : ''}${p.deadline ? '. Срок — ' + esc(p.deadline) : ''}.</p>

                    <div class="l-hero-stat">
                        <p class="l-pct" id="cpPctNum">${pct}%</p>
                        <div class="l-pct-note">Готовность проекта.<br>${done} выполнено, ${left} впереди.</div>
                    </div>
                    <div class="l-rule"><i class="fill-anim" data-w="${pct}"></i></div>

                    <section class="l-block">
                        <div class="l-h">Сводка</div>
                        <div class="l-status">
                            <div><strong>${done}</strong><span>готово</span></div>
                            <div><strong>${left}</strong><span>осталось</span></div>
                            <div><strong>${total}</strong><span>всего этапов</span></div>
                            <div><strong>${byStatus.length}</strong><span>статусов</span></div>
                        </div>
                    </section>

                    <section class="l-block">
                        <div class="l-h">Мой сайт</div>
                        <div class="l-site">
                            <p style="margin:0;color:#6b645c;font-size:14px;">Вставьте адрес — сохраним в кабинете.</p>
                            <form onsubmit="return false;">
                                <input id="cpSiteUrl" placeholder="https://ваш-сайт.ru" value="${esc(siteUrl)}">
                                <button type="button" id="cpSiteSave">Сохранить</button>
                            </form>
                            <div id="cpSiteMsg" style="font-size:13px;min-height:1.2em;"></div>
                            <div id="cpSiteCurrent" style="font-size:14px;color:#6b645c;">${siteUrl ? 'Сейчас: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener" style="color:#b45309">'+esc(siteUrl)+'</a>' : 'Сайт ещё не указан'}</div>
                            <div class="l-h" style="margin-top:22px;">Заходы по ссылке · 30 дней</div>
                            ${showVisits ? `
                                <div style="font-size:13px;color:#6b645c;">Всего просмотров: <b>${visitsTotal}</b></div>
                                <div class="l-chart-mini">${visits.map(v => {
                                    const maxV = Math.max(1, ...visits.map(x => x.count));
                                    const h = v.count ? Math.max(8, Math.round((v.count/maxV)*100)) : 3;
                                    return `<i class="${v.count?'on':''}" style="height:${h}%"></i>`;
                                }).join('')}</div>
                            ` : '<p style="color:#6b645c;font-size:14px;margin:0;">Статистика выключена</p>'}
                        </div>
                    </section>

                    <section class="l-block">
                        <div class="l-h">Закрыто по неделям</div>
                        <div class="l-weeks">
                            ${weeks.map(w => {
                                const maxW = Math.max(1, ...weeks.map(x => x.count));
                                const h = w.count ? Math.max(12, Math.round((w.count/maxW)*100)) : 6;
                                return `<div class="${w.count?'on':''}" style="height:${h}%" title="${esc(w.label)}: ${w.count}"></div>`;
                            }).join('')}
                        </div>
                    </section>

                    <section class="l-block">
                        <div class="l-h">Этапы</div>
                        ${tasks.map(t => `
                            <div class="l-task ${t.done?'done':''}">
                                <div class="l-dot ${t.done?'on':''}">${t.done?'✓':''}</div>
                                <div><div class="name" style="font-weight:500">${esc(t.name)}</div><div style="color:#6b645c;font-size:13px">${esc(t.status)}</div></div>
                            </div>
                        `).join('') || '<p style="color:#6b645c">Нет этапов</p>'}
                    </section>

                    ${acts.length ? `
                    <section class="l-block">
                        <div class="l-h">Что сделано</div>
                        <div class="l-feed">${acts.slice(0,12).map(a => `<p>${esc(actLabel(a))}<br><time>${esc(fmtWhen(a.created_at))}</time></p>`).join('')}</div>
                    </section>` : ''}

                    ${docs.length ? `
                    <section class="l-block">
                        <div class="l-h">Документы</div>
                        ${docs.map(d => `<div style="padding:10px 0;border-bottom:1px solid #e5dfd3;">${esc(d.name)} <span style="color:#6b645c">· ${esc(d.type||'')}</span></div>`).join('')}
                    </section>` : ''}
                </div>
            </div>`;
        }

        function renderDatacore(ctx) {
            const { p, pct, done, total, left, byStatus, weeks, tasks, acts, docs, showVisits, visits, visitsTotal, siteUrl } = ctx;
            return `
            <div class="layout-datacore">
                <div class="d-shell">
                    <aside class="d-side">
                        <div class="d-logo">Datacore // Portal</div>
                        <nav class="d-nav">
                            <a class="on" href="#d-overview">Overview</a>
                            <a href="#d-site">Site watch</a>
                            <a href="#d-tasks">Tasks</a>
                            <a href="#d-activity">Activity</a>
                            ${docs.length ? '<a href="#d-docs">Documents</a>' : ''}
                        </nav>
                        <div class="d-side-metric">
                            <span style="font-size:11px;color:#7d8fa3;text-transform:uppercase;letter-spacing:.08em;">Progress</span>
                            <b id="cpPctNum">${pct}%</b>
                            <div class="d-bar"><i class="fill-anim" data-w="${pct}"></i></div>
                        </div>
                    </aside>
                    <main class="d-main">
                        <div class="d-head" id="d-overview">
                            <div>
                                <h1>${esc(p.name || 'Проект')}</h1>
                                <p>${esc(p.client || '')}${p.status ? ' · ' + esc(p.status) : ''}${p.deadline ? ' · due ' + esc(p.deadline) : ''}${ctx.isPreview ? ' · preview' : ''}</p>
                            </div>
                            <span class="d-badge">LIVE · CLIENT</span>
                        </div>

                        <div class="d-kpis">
                            <div class="d-kpi"><span>Done</span><strong>${done}</strong></div>
                            <div class="d-kpi"><span>Left</span><strong>${left}</strong></div>
                            <div class="d-kpi"><span>Total</span><strong>${total}</strong></div>
                            <div class="d-kpi"><span>Visits 30d</span><strong>${showVisits ? visitsTotal : '—'}</strong></div>
                        </div>

                        <div class="d-grid2">
                            <section class="d-panel">
                                <h2>Status breakdown</h2>
                                ${byStatus.map(s => {
                                    const maxS = Math.max(1, ...byStatus.map(x => x.count));
                                    return `<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;"><span>${esc(s.name)}</span><b>${s.count}</b></div>
                                    <div class="d-bar" style="margin:0 0 10px"><i class="fill-anim" data-w="${Math.round((s.count/maxS)*100)}"></i></div>`;
                                }).join('') || '<div style="color:#7d8fa3;font-size:13px;">No data</div>'}
                            </section>
                            <section class="d-panel">
                                <h2>Weekly closes</h2>
                                <div class="d-chart">${weeks.map(w => {
                                    const maxW = Math.max(1, ...weeks.map(x => x.count));
                                    const h = w.count ? Math.max(10, Math.round((w.count/maxW)*100)) : 4;
                                    return `<i class="${w.count?'on':''}" style="height:${h}%" title="${esc(w.label)}: ${w.count}"></i>`;
                                }).join('')}</div>
                            </section>
                        </div>

                        <section class="d-panel" id="d-site" style="margin-bottom:10px;">
                            <h2>Site watch · URL</h2>
                            <div class="d-search">
                                <input id="cpSiteUrl" placeholder="https://example.ru" value="${esc(siteUrl)}">
                                <button type="button" id="cpSiteSave">SAVE</button>
                            </div>
                            <div id="cpSiteMsg" class="d-msg"></div>
                            <div id="cpSiteCurrent" class="d-msg">${siteUrl ? 'Tracking: <a href="'+esc(siteUrl)+'" target="_blank" rel="noopener" style="color:#2dd4bf">'+esc(siteUrl)+'</a>' : 'No site URL yet'}</div>
                            <h2 style="margin-top:16px;">Link visits · 30d</h2>
                            ${showVisits ? `
                                <div class="d-chart" style="height:80px;">${visits.map(v => {
                                    const maxV = Math.max(1, ...visits.map(x => x.count));
                                    const h = v.count ? Math.max(8, Math.round((v.count/maxV)*100)) : 3;
                                    return `<i class="${v.count?'on':''}" style="height:${h}%"></i>`;
                                }).join('')}</div>
                            ` : '<div class="d-msg">Stats disabled by manager</div>'}
                        </section>

                        <section class="d-panel" id="d-tasks" style="margin-bottom:10px;">
                            <h2>Tasks table</h2>
                            <div style="overflow:auto;">
                                <table>
                                    <thead><tr><th>Task</th><th>Status</th><th>State</th></tr></thead>
                                    <tbody>
                                        ${tasks.map(t => `
                                            <tr>
                                                <td>${esc(t.name)}</td>
                                                <td>${esc(t.status)}</td>
                                                <td class="${t.done?'ok':'wait'}">${t.done?'DONE':'OPEN'}</td>
                                            </tr>
                                        `).join('') || '<tr><td colspan="3" style="color:#7d8fa3">No tasks</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        ${acts.length ? `
                        <section class="d-panel" id="d-activity" style="margin-bottom:10px;">
                            <h2>Activity log</h2>
                            <div class="d-feed">${acts.slice(0,15).map(a => `<div>[${esc(fmtWhen(a.created_at))}] ${esc(actLabel(a))}</div>`).join('')}</div>
                        </section>` : ''}

                        ${docs.length ? `
                        <section class="d-panel" id="d-docs">
                            <h2>Documents</h2>
                            <table>
                                <thead><tr><th>Name</th><th>Type</th></tr></thead>
                                <tbody>${docs.map(d => `<tr><td>${esc(d.name)}</td><td>${esc(d.type||'')}</td></tr>`).join('')}</tbody>
                            </table>
                        </section>` : ''}
                    </main>
                </div>
            </div>`;
        }

        function render(data) {
            document.body.setAttribute('data-layout', theme);
            const p = data.project || {};
            const st = data.stats || {};
            const pct = Math.max(0, Math.min(100, st.progress ?? p.progress ?? 0));
            const tasks = data.tasks || [];
            const visits = data.visits || [];
            const docs = data.documents || [];
            const acts = data.activity || [];
            const showVisits = data.stats_enabled !== false;
            const byStatus = statusCounts(tasks);
            const weeks = weekBuckets(acts);
            const done = st.done || 0;
            const total = st.total || 0;
            const left = Math.max(0, total - done);
            const ctx = {
                p, pct, done, total, left, byStatus, weeks, tasks, acts, docs,
                showVisits, visits, visitsTotal: data.visitsTotal || 0,
                siteUrl: data.site_url || '', isPreview
            };
            document.title = (p.name || 'Проект') + ' — ' + theme;
            const html = ({
                neon: renderNeon,
                nebula: renderNebula,
                radiant: renderRadiant,
                lumen: renderLumen,
                datacore: renderDatacore
            })[theme](ctx);
            root.innerHTML = html;
            bindSite(token);
            requestAnimationFrame(() => animateBars('.fill-anim', 'data-w'));
            if (window.gsap) {
                const hero = root.querySelector('.n-hero, .nb-head, .r-top, .l-shell, .d-head');
                if (hero) gsap.from(hero, { opacity: 0, y: 24, duration: 0.7, ease: 'power2.out' });
            }
        }

        if (!token) {
            root.innerHTML = '<div class="cp-err"><h2>Ссылка неполная</h2><p>Откройте полную ссылку от менеджера.</p></div>';
            return;
        }

        try {
            if (!isPreview) {
                fetch('/api/public/client/' + encodeURIComponent(token) + '/visit', { method: 'POST' }).catch(() => {});
            }
            const res = await fetch('/api/public/client/' + encodeURIComponent(token));
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Не найдено');
            window.__cpData = data;
            render(data);
        } catch (e) {
            root.innerHTML = `<div class="cp-err"><h2>Не удалось открыть</h2><p>${esc(e.message || e)}</p></div>`;
        }
    })();
    </script>
</body>
</html>
