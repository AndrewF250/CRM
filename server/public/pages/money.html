<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деньги — CRM System</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=45">
    <style>
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid var(--gray-200); padding-bottom: 0; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--gray-500); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
        .tab:hover { color: var(--gray-700); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 20px; }
        .stat-label { font-size: 0.85rem; color: var(--gray-500); margin-bottom: 4px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-value.income { color: var(--success); }
        .stat-value.expense { color: var(--danger); }
        .expense-card {
            background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg);
            padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }
        .expense-info { flex: 1; min-width: 0; }
        .expense-category { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 0.75rem; font-weight: 500; margin-bottom: 4px; }
        .expense-category.salary { background: #dbeafe; color: #1e40af; }
        .expense-category.equipment { background: #fef3c7; color: #92400e; }
        .expense-category.service { background: #d1fae5; color: #065f46; }
        .expense-category.other { background: #f3f4f6; color: #374151; }
        .expense-desc { font-weight: 500; }
        .expense-meta { font-size: 0.8rem; color: var(--gray-500); margin-top: 2px; }
        .expense-amount { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
        .expense-amount.negative { color: var(--danger); }
        .expense-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .salary-status { padding: 4px 10px; border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
        .salary-status.paid { background: #d1fae5; color: #065f46; }
        .salary-status.unpaid { background: #fef3c7; color: #92400e; }
        .month-selector { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .month-selector input, .month-selector select { padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: var(--radius-md); font-size: 0.9rem; background: var(--white); }
        .category-breakdown { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
        .category-item { display: flex; align-items: center; gap: 8px; }
        .category-dot { width: 12px; height: 12px; border-radius: 50%; }
        .category-name { font-size: 0.85rem; color: var(--gray-600); }
        .category-amount { font-weight: 600; margin-left: auto; }
        .money-salary-fields[hidden] { display: none !important; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="/assets/js/api.js?v=23"></script>
    <script src="/assets/js/app.js?v=38"></script>
    <script>
    (async function() {
        if (!API.requireAuth()) return;
        
        const app = document.getElementById('app');
        let currentTab = 'expenses';
        let currentMonth = new Date().toISOString().slice(0, 7);
        let categoryFilter = '';
        let expenses = [];
        let salaries = [];
        let expenseStats = { categories: [], total: 0 };

        const CATEGORIES = ['Зарплата', 'Оборудование', 'Сервисы', 'Реклама', 'Аренда', 'Связь', 'Транспорт', 'Питание', 'Прочее'];

        function render() {
            app.innerHTML = renderSidebar('money') + renderHeader() + `
                <div class="page-header">
                    <div><h1 class="page-title">Деньги</h1><p class="page-subtitle">Управление финансами</p></div>
                    <div class="page-actions">
                        <button class="btn btn-primary" onclick="showAddExpenseModal()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Расход
                        </button>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab ${currentTab === 'expenses' ? 'active' : ''}" onclick="switchTab('expenses')">Расходы</div>
                    <div class="tab ${currentTab === 'salaries' ? 'active' : ''}" onclick="switchTab('salaries')">Зарплаты</div>
                    <div class="tab ${currentTab === 'stats' ? 'active' : ''}" onclick="switchTab('stats')">Статистика</div>
                </div>

                <div class="month-selector">
                    <label>Месяц:</label>
                    <input type="month" id="monthPicker" value="${currentMonth}" onchange="changeMonth(this.value)">
                    ${currentTab === 'expenses' ? `
                    <label>Категория:</label>
                    <select id="categoryFilter" onchange="changeCategoryFilter(this.value)">
                        <option value="">Все</option>
                        ${CATEGORIES.map(c => `<option value="${c}"${categoryFilter === c ? ' selected' : ''}>${c}</option>`).join('')}
                    </select>` : ''}
                </div>

                <div id="tabContent"></div>
            `;
            
            renderTabContent();
            initCommonUI();
        }

        function renderTabContent() {
            const container = document.getElementById('tabContent');
            if (!container) return;
            if (currentTab === 'expenses') {
                container.innerHTML = renderExpensesTab();
            } else if (currentTab === 'salaries') {
                container.innerHTML = renderSalariesTab();
            } else {
                container.innerHTML = renderStatsTab();
            }
        }

        function salaryMethodLabel(m) {
            return m === 'cash' ? 'Наличка' : 'Перевод';
        }

        function formatRuDate(d) {
            if (!d) return '';
            const parts = String(d).slice(0, 10).split('-');
            if (parts.length !== 3) return d;
            return parts[2] + '.' + parts[1] + '.' + parts[0];
        }

        function getCategoryClass(cat) {
            const map = { 'Зарплата': 'salary', 'Оборудование': 'equipment', 'Сервисы': 'service' };
            return map[cat] || 'other';
        }

        function formatMoney(amount) {
            return new Intl.NumberFormat('ru-RU').format(amount || 0);
        }

        /** Unified card for expense or salary */
        function renderMoneyCard(item) {
            if (item._type === 'salary') {
                const s = item;
                const meta = [
                    s.pay_date ? formatRuDate(s.pay_date) : '',
                    salaryMethodLabel(s.payment_method),
                    s.note || ''
                ].filter(Boolean).join(' · ');
                return `
                <div class="expense-card" data-kind="salary" data-id="${s.id}">
                    <div class="expense-info">
                        <span class="expense-category salary">Зарплата</span>
                        <div class="expense-desc">${esc(s.user_name)}</div>
                        <div class="expense-meta">${esc(meta)}</div>
                    </div>
                    <div class="expense-amount negative">-${formatMoney(s.amount)} ₽</div>
                    <div class="expense-actions">
                        <span class="salary-status ${s.paid ? 'paid' : 'unpaid'}">${s.paid ? 'Выплачено' : 'Не выплачено'}</span>
                        <button class="btn btn-sm ${s.paid ? 'btn-secondary' : 'btn-success'}" onclick="toggleSalaryPaid(${s.id}, ${!s.paid})">
                            ${s.paid ? 'Отменить' : 'Оплатить'}
                        </button>
                        <button class="btn btn-sm btn-ghost" onclick="deleteSalary(${s.id})" title="Удалить" aria-label="Удалить">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        </button>
                    </div>
                </div>`;
            }
            const e = item;
            const meta = [
                e.date ? formatRuDate(e.date) : '',
                e.person || '',
                e.note || ''
            ].filter(Boolean).join(' · ');
            return `
                <div class="expense-card" data-kind="expense" data-id="${e.id}">
                    <div class="expense-info">
                        <span class="expense-category ${getCategoryClass(e.category)}">${esc(e.category)}</span>
                        <div class="expense-desc">${esc(e.description)}</div>
                        <div class="expense-meta">${esc(meta)}</div>
                    </div>
                    <div class="expense-amount negative">-${formatMoney(e.amount)} ₽</div>
                    <div class="expense-actions">
                        <button class="btn btn-sm btn-ghost" onclick="deleteExpense(${e.id})" title="Удалить" aria-label="Удалить">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        </button>
                    </div>
                </div>`;
        }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function buildExpensesList() {
            let list = expenses.map(e => ({ ...e, _type: 'expense', _sort: e.date || '' }));
            const includeSalaries = !categoryFilter || categoryFilter === 'Зарплата';
            if (includeSalaries) {
                list = list.concat(salaries.map(s => ({
                    ...s,
                    _type: 'salary',
                    _sort: s.pay_date || s.month || ''
                })));
            }
            if (categoryFilter && categoryFilter !== 'Зарплата') {
                list = list.filter(i => i._type === 'expense' && i.category === categoryFilter);
            } else if (categoryFilter === 'Зарплата') {
                list = list.filter(i => i._type === 'salary' || (i._type === 'expense' && i.category === 'Зарплата'));
            }
            list.sort((a, b) => String(b._sort).localeCompare(String(a._sort)));
            return list;
        }

        function renderExpensesTab() {
            const list = buildExpensesList();
            if (list.length === 0) {
                return '<div class="empty-state"><p>Нет расходов за этот месяц</p></div>';
            }
            return list.map(renderMoneyCard).join('');
        }

        function renderSalariesTab() {
            if (salaries.length === 0) {
                return '<div class="empty-state"><p>Нет зарплат за этот месяц</p></div>';
            }
            return salaries
                .map(s => ({ ...s, _type: 'salary' }))
                .sort((a, b) => String(b.pay_date || '').localeCompare(String(a.pay_date || '')))
                .map(renderMoneyCard)
                .join('');
        }

        function renderStatsTab() {
            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
            const salaryTotal = salaries.reduce((sum, s) => sum + (s.amount || 0), 0);
            const salaryPaid = salaries.filter(s => s.paid).reduce((sum, s) => sum + (s.amount || 0), 0);
            // Merge salary total into category breakdown for display
            const cats = [...(expenseStats.categories || [])];
            const salIdx = cats.findIndex(c => c.category === 'Зарплата');
            if (salaryTotal > 0) {
                if (salIdx >= 0) cats[salIdx] = { category: 'Зарплата', total: (cats[salIdx].total || 0) + salaryTotal };
                else cats.unshift({ category: 'Зарплата', total: salaryTotal });
            }
            const grandTotal = (expenseStats.total || 0) + salaryTotal;
            return `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Всего расходов</div>
                        <div class="stat-value expense">${formatMoney(grandTotal)} ₽</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Зарплаты</div>
                        <div class="stat-value">${formatMoney(salaryTotal)} ₽</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Выплачено</div>
                        <div class="stat-value income">${formatMoney(salaryPaid)} ₽</div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><h3 class="card-title">Расходы по категориям</h3></div>
                    <div class="card-body">
                        <div class="category-breakdown">
                            ${cats.map((c, i) => `
                                <div class="category-item">
                                    <div class="category-dot" style="background:${colors[i % colors.length]}"></div>
                                    <span class="category-name">${esc(c.category)}</span>
                                    <span class="category-amount">${formatMoney(c.total)} ₽</span>
                                </div>
                            `).join('') || '<p class="text-muted">Нет данных</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        window.switchTab = function(tab) {
            currentTab = tab;
            render();
        };

        window.changeMonth = function(month) {
            currentMonth = month;
            loadData();
        };

        window.changeCategoryFilter = function(val) {
            categoryFilter = val || '';
            renderTabContent();
        };

        async function loadData() {
            try {
                const [expRes, salRes, statsRes] = await Promise.all([
                    API.get(`/api/expenses?month=${currentMonth}`),
                    API.get(`/api/salaries?month=${currentMonth}`),
                    API.get(`/api/expenses/stats?month=${currentMonth}`)
                ]);
                expenses = expRes || [];
                salaries = salRes || [];
                expenseStats = statsRes || { categories: [], total: 0 };
                renderTabContent();
            } catch (err) {
                console.error('Failed to load data:', err);
            }
        }

        function syncExpenseSalaryFields() {
            const cat = document.getElementById('expenseCategory')?.value;
            const box = document.getElementById('moneySalaryFields');
            const descGroup = document.getElementById('expenseDescGroup');
            const personGroup = document.getElementById('expensePersonGroup');
            const isSal = cat === 'Зарплата';
            if (box) box.hidden = !isSal;
            if (descGroup) descGroup.hidden = isSal;
            if (personGroup) personGroup.hidden = isSal;
        }

        window.showAddExpenseModal = function() {
            const todayStr = new Date().toISOString().split('T')[0];
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3 class="modal-title">Новый расход</h3><button class="modal-close" onclick="closeModal(true)" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                    <div class="modal-body">
                        <div class="form-group"><label class="form-label" for="expenseCategory">Категория *</label>
                            <select class="form-select" id="expenseCategory">
                                ${CATEGORIES.map(c => `<option${c === 'Зарплата' && categoryFilter === 'Зарплата' ? ' selected' : ''}>${c}</option>`).join('')}
                            </select>
                        </div>
                        <div class="form-group" id="expenseDescGroup"><label class="form-label" for="expenseDesc">Описание *</label><input type="text" class="form-input" id="expenseDesc" placeholder="На что потрачено?"></div>
                        <div class="money-salary-fields" id="moneySalaryFields" hidden>
                            <div class="form-group"><label class="form-label" for="salaryUser">Сотрудник *</label>
                                <select class="form-select" id="salaryUser">
                                    <option>Костя</option>
                                    <option>Максим</option>
                                    <option>Андрей</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label" for="salaryMethod">Способ выплаты *</label>
                                <select class="form-select" id="salaryMethod">
                                    <option value="cash">Наличка</option>
                                    <option value="transfer" selected>Перевод</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="expenseAmount">Сумма *</label><input type="number" class="form-input" id="expenseAmount" placeholder="0"></div>
                            <div class="form-group"><label class="form-label" for="expenseDate">Дата *</label><input type="date" class="form-input" id="expenseDate" value="${todayStr}"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group" id="expensePersonGroup"><label class="form-label" for="expensePerson">Кто</label>
                                <select class="form-select" id="expensePerson">
                                    <option value="">-</option>
                                    <option>Костя</option>
                                    <option>Максим</option>
                                    <option>Андрей</option>
                                </select>
                            </div>
                            <div class="form-group"><label class="form-label" for="expenseNote">Комментарий</label><input type="text" class="form-input" id="expenseNote" placeholder="Комментарий"></div>
                        </div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="addExpense()">Добавить</button></div>
                </div>
            `;
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            document.getElementById('expenseCategory')?.addEventListener('change', syncExpenseSalaryFields);
            if (categoryFilter === 'Зарплата') {
                const cat = document.getElementById('expenseCategory');
                if (cat) cat.value = 'Зарплата';
            }
            syncExpenseSalaryFields();
        };

        window.addExpense = async function() {
            const modal = document.querySelector('.modal-overlay.show .modal') || document;
            const submitBtn = modal.querySelector('.btn-primary') || this;
            await withButtonLock(submitBtn, async () => {
                const category = document.getElementById('expenseCategory').value;
                const amount = parseFloat(document.getElementById('expenseAmount').value);
                const date = document.getElementById('expenseDate').value;
                const note = document.getElementById('expenseNote').value.trim();

                if (category === 'Зарплата') {
                    if (!validateForm([
                        { id: 'expenseAmount', required: true, message: 'Введите сумму' },
                        { id: 'expenseDate', required: true, message: 'Выберите дату' }
                    ])) return;
                    const user_name = document.getElementById('salaryUser').value;
                    const payment_method = document.getElementById('salaryMethod').value;
                    const month = String(date || '').slice(0, 7) || currentMonth;
                    await API.post('/api/salaries', {
                        user_name, amount, month, note,
                        pay_date: date, payment_method
                    });
                    closeModal();
                    showToast('Зарплата добавлена', 'success');
                    loadData();
                    return;
                }

                if (!validateForm([
                    { id: 'expenseDesc', required: true, message: 'Введите описание' },
                    { id: 'expenseAmount', required: true, message: 'Введите сумму' },
                    { id: 'expenseDate', required: true, message: 'Выберите дату' }
                ])) return;

                const description = document.getElementById('expenseDesc').value.trim();
                const person = document.getElementById('expensePerson').value;
                await API.post('/api/expenses', { category, description, amount, date, person, note });
                closeModal();
                showToast('Расход добавлен', 'success');
                loadData();
            });
        };

        window.toggleSalaryPaid = async function(id, paid) {
            const salary = salaries.find(s => s.id === id);
            if (!salary) return;
            try {
                await API.put(`/api/salaries/${id}`, { ...salary, paid });
                showToast(paid ? 'Зарплата выплачена' : 'Отменено', 'success');
                loadData();
            } catch (err) {
                showToast('Ошибка: ' + err.message, 'error');
            }
        };

        window.deleteExpense = async function(id) {
            confirmDelete('Расход удалён', {
                optimistic: () => {
                    document.querySelector(`.expense-card[data-kind="expense"][data-id="${id}"]`)?.remove();
                },
                commit: async () => {
                    await API.delete(`/api/expenses/${id}`);
                    loadData();
                },
                undo: () => loadData()
            });
        };

        window.deleteSalary = async function(id) {
            confirmDelete('Запись о зарплате удалена', {
                optimistic: () => {
                    document.querySelector(`.expense-card[data-kind="salary"][data-id="${id}"]`)?.remove();
                },
                commit: async () => {
                    await API.delete(`/api/salaries/${id}`);
                    loadData();
                },
                undo: () => loadData()
            });
        };

        await loadData();
        render();
        
        window.refreshPageData = async function() {
            await loadData();
            renderTabContent();
        };
    })();
    </script>
</body>
</html>
