<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проекты — CRM System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div id="app"></div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="/assets/js/api.js?v=5"></script>
    <script src="/assets/js/app.js?v=5"></script>
    <script src="/assets/js/crm-data.js?v=5"></script>
    <script>
    (async function() {
        if (!API.requireAuth()) return;
        
        const app = document.getElementById('app');
        app.innerHTML = renderSidebar('projects') + renderHeader() + `
            <div class="page-header">
                <div><h1 class="page-title">Проекты</h1><p class="page-subtitle">Управление заказами</p></div>
                <div class="page-actions">
                    <div style="display:flex;gap:4px;">
                        <button class="btn btn-secondary btn-sm" id="viewKanban" onclick="switchView('kanban')" style="background:var(--primary-light);color:var(--primary);border-color:var(--primary);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg> Канбан</button>
                        <button class="btn btn-secondary btn-sm" id="viewTable" onclick="switchView('table')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg> Таблица</button>
                    </div>
                    <button class="btn btn-secondary btn-sm" onclick="showColumnConfigModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33"/></svg> Колонки</button>
                    <button class="btn btn-primary" onclick="showNewProjectModal()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Новый проект</button>
                </div>
            </div>
            <div class="filter-bar" style="flex-wrap:wrap;">
                <span class="text-sm text-muted" style="margin-right:4px;">Статус:</span>
                <button class="filter-chip active" onclick="filterProjects('all', this)">Все</button>
                <button class="filter-chip" onclick="filterProjects('В работе', this)">В работе</button>
                <button class="filter-chip" onclick="filterProjects('Переговоры', this)">Переговоры</button>
                <button class="filter-chip" onclick="filterProjects('Новый', this)">Новые</button>
                <button class="filter-chip" onclick="filterProjects('Выполнено', this)">Выполнено</button>
                <span class="text-sm text-muted" style="margin-left:12px;margin-right:4px;">Хештег:</span>
                <select class="form-select" id="hashtagFilter" onchange="filterByHashtag(this.value)" style="width:auto;padding:4px 8px;font-size:0.8rem;">
                    <option value="">Все хештеги</option>
                </select>
            </div>
            <div id="kanbanView"></div>
            <div id="tableView" class="hidden"></div>
            </div></div></div>
        `;
        
        initCommonUI();
        // Make content full-width for projects page
        const contentWrapper = document.querySelector('.content-wrapper');
        if (contentWrapper) contentWrapper.classList.add('full-width');
        await CRM.load();
        
        // Load hashtags for filter
        const hashtags = await API.gethashtags ? await API.gethashtags() : [];
        const hashtagSelect = document.getElementById('hashtagFilter');
        if (Array.isArray(hashtags)) {
            hashtags.forEach(h => {
                hashtagSelect.innerHTML += `<option value="${h}">${h}</option>`;
            });
        }
        
        let currentFilter = 'all';
        let currentHashtag = '';
        let kanbanColumns = [];

        // Load kanban columns from API
        async function loadColumns() {
            try {
                kanbanColumns = await API.get('/api/kanban-columns');
            } catch (err) {
                // Fallback to defaults
                kanbanColumns = [
                    { id: 1, name: 'Новый', color: 'blue', sort_order: 0 },
                    { id: 2, name: 'Переговоры', color: 'yellow', sort_order: 1 },
                    { id: 3, name: 'В работе', color: 'green', sort_order: 2 },
                    { id: 4, name: 'Абонемент', color: 'blue', sort_order: 3 },
                    { id: 5, name: 'Выполнено', color: 'gray', sort_order: 4 }
                ];
            }
        }
        await loadColumns();
        
        window.switchView = function(view) {
            const kanban = document.getElementById('kanbanView');
            const table = document.getElementById('tableView');
            const btnKanban = document.getElementById('viewKanban');
            const btnTable = document.getElementById('viewTable');
            
            if (view === 'kanban') {
                kanban.classList.remove('hidden');
                table.classList.add('hidden');
                btnKanban.style.background = 'var(--primary-light)';
                btnKanban.style.color = 'var(--primary)';
                btnKanban.style.borderColor = 'var(--primary)';
                btnTable.style.background = '';
                btnTable.style.color = '';
                btnTable.style.borderColor = '';
            } else {
                kanban.classList.add('hidden');
                table.classList.remove('hidden');
                btnTable.style.background = 'var(--primary-light)';
                btnTable.style.color = 'var(--primary)';
                btnTable.style.borderColor = 'var(--primary)';
                btnKanban.style.background = '';
                btnKanban.style.color = '';
                btnKanban.style.borderColor = '';
            }
        };
        
        window.filterProjects = function(status, btn) {
            currentFilter = status;
            document.querySelectorAll('.filter-bar .filter-chip').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            renderProjects();
        };
        
        window.filterByHashtag = function(tag) {
            currentHashtag = tag;
            renderProjects();
        };
        
        window.deleteProject = async function(id) {
            confirmDelete('Удалить проект и все его задачи?', async () => {
                try {
                    await API.deleteProject(id);
                    showToast('Проект удалён', 'success');
                    await CRM.load();
                    renderProjects();
                } catch (err) {
                    showToast('Ошибка: ' + err.message, 'error');
                }
            });
        };
        
        function getFilteredProjects() {
            let projects = CRM.getProjects();
            if (currentFilter !== 'all') {
                projects = projects.filter(p => p.status === currentFilter);
            }
            if (currentHashtag) {
                projects = projects.filter(p => p.hashtags && p.hashtags.includes(currentHashtag));
            }
            return projects;
        }
        
        function formatAmountInput(value) {
            return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
        }
        
        const colorDots = { blue: 'blue', yellow: 'yellow', green: 'green', gray: 'gray', red: 'red', purple: 'blue' };
        const avatarColors = ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];
        function getAvatarColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return avatarColors[Math.abs(hash) % avatarColors.length];
        }
        function renderTeamAvatars(team, small) {
            if (!team || team.length === 0) return '';
            const cls = small ? 'team-avatar team-avatar-sm' : 'team-avatar';
            return '<div class="team-avatars">' + team.map(name => {
                const initials = name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                return `<div class="${cls}" style="background:${getAvatarColor(name)};" title="${name}">${initials}</div>`;
            }).join('') + '</div>';
        }

        function renderProjects() {
            const projects = getFilteredProjects();

            let kanbanHtml = '<div class="kanban-board">';
            kanbanColumns.forEach(col => {
                const colProjects = projects.filter(p => p.status === col.name);
                const dot = colorDots[col.color] || 'gray';
                kanbanHtml += `<div class="kanban-column"><div class="kanban-column-header"><div class="kanban-column-title"><span class="status-dot ${dot}"></span> ${col.name} <span class="kanban-count">${colProjects.length}</span></div></div><div class="kanban-column-body" data-column="${col.name}">`;
                colProjects.forEach(p => {
                    const adeqEmoji = { 'good': '😊', 'warn': '😐', 'bad': '😡' };
                    kanbanHtml += `<div class="kanban-card${p.urgent ? ' urgent' : ''}" draggable="true" data-project-id="${p.id}">
                        <a href="/pages/project.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block;" onclick="event.stopPropagation()">
                            <div style="display:flex;justify-content:space-between;align-items:start;">
                                <div class="kanban-card-title">${p.name}</div>
                                <div style="display:flex;align-items:center;gap:4px;">
                                    <span class="pay-icon ${p.pay_status || 'unpaid'}" title="${p.pay_status === 'paid' ? 'Оплачено' : p.pay_status === 'pending' ? 'Ждём оплату' : 'Не оплачено'}">$</span>
                                    <span class="adequacy-icon ${p.adequacy || 'good'}" title="${p.adequacy === 'good' ? 'Нормальный' : p.adequacy === 'warn' ? 'Осторожно' : 'Не работаем'}">${adeqEmoji[p.adequacy] || '😊'}</span>
                                    <button class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:0.7rem;" onclick="event.preventDefault();event.stopPropagation();deleteProject('${p.id}')" aria-label="Удалить">✕</button>
                                </div>
                            </div>
                            <div class="kanban-card-client">${p.client}${p.phone ? ' · ' + p.phone : ''}</div>
                            ${renderTeamAvatars(p.team, false)}
                            ${(p.hashtags && p.hashtags.length > 0) ? '<div class="hashtags" style="margin:4px 0;">' + p.hashtags.map(h => '<span class="hashtag">' + h + '</span>').join('') + '</div>' : ''}
                            <div class="kanban-card-footer"><span class="kanban-card-status"><span class="status-dot ${dot}"></span> ${col.name}</span><span class="kanban-card-amount">${formatAmountInput(p.amount)} ₽</span></div>
                        </a>
                    </div>`;
                });
                kanbanHtml += '</div></div>';
            });
            kanbanHtml += '</div>';
            document.getElementById('kanbanView').innerHTML = kanbanHtml;

            let tableHtml = '<div class="card"><div class="table-wrapper"><table class="table"><thead><tr><th>Проект</th><th>Клиент</th><th>Команда</th><th>Статус</th><th>Оплата</th><th>Сумма</th><th>Прогресс</th><th></th></tr></thead><tbody>';
            projects.forEach(p => {
                const adeqEmoji = { 'good': '😊', 'warn': '😐', 'bad': '😡' };
                tableHtml += `<tr>
                    <td><a href="/pages/project.html?id=${p.id}" style="text-decoration:none;color:inherit;"><div class="table-cell-name">${p.name}</div>${(p.hashtags||[]).length > 0 ? '<div class="hashtags" style="margin-top:4px;">' + p.hashtags.map(h => '<span class="hashtag">'+h+'</span>').join('') + '</div>' : ''}</a></td>
                    <td>${p.client}<br><span class="text-sm text-muted">${p.phone || ''}</span></td>
                    <td>${renderTeamAvatars(p.team, true)}</td>
                    <td><span class="badge ${getStatusClass(p.status)}">${p.status}</span></td>
                    <td><span class="pay-icon ${p.pay_status || 'unpaid'}" title="${p.pay_status === 'paid' ? 'Оплачено' : p.pay_status === 'pending' ? 'Ждём' : 'Не оплачено'}">$</span> <span class="adequacy-icon ${p.adequacy || 'good'}" title="${p.adequacy === 'good' ? 'Нормальный' : p.adequacy === 'warn' ? 'Осторожно' : 'Не работаем'}">${adeqEmoji[p.adequacy] || '😊'}</span></td>
                    <td class="table-cell-amount">${formatAmountInput(p.amount)} ₽</td>
                    <td><div class="progress-bar" style="width:80px;"><div class="progress-fill" style="width:${p.progress}%;"></div></div></td>
                    <td><button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteProject('${p.id}')">Удалить</button></td>
                </tr>`;
            });
            tableHtml += '</tbody></table></div></div>';
            document.getElementById('tableView').innerHTML = tableHtml;

            initDragDrop();
        }
        
        renderProjects();
        
        function initDragDrop() {
            const cards = document.querySelectorAll('.kanban-card[draggable]');
            const columns = document.querySelectorAll('.kanban-column-body');
            
            cards.forEach(card => {
                card.addEventListener('dragstart', function(e) {
                    this.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', this.dataset.projectId);
                });
                card.addEventListener('dragend', function() {
                    this.classList.remove('dragging');
                    document.querySelectorAll('.kanban-column-body').forEach(col => {
                        col.style.background = '';
                        col.style.minHeight = '';
                    });
                });
            });
            
            columns.forEach(col => {
                col.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    this.style.background = 'rgba(99,102,241,0.08)';
                    this.style.minHeight = '100px';
                });
                col.addEventListener('dragleave', function() {
                    this.style.background = '';
                    this.style.minHeight = '';
                });
                col.addEventListener('drop', async function(e) {
                    e.preventDefault();
                    this.style.background = '';
                    this.style.minHeight = '';
                    
                    const projectId = e.dataTransfer.getData('text/plain');
                    const newStatus = this.dataset.column;
                    
                    if (projectId && newStatus) {
                        try {
                            const project = CRM.getProject(projectId);
                            if (project && project.status !== newStatus) {
                                await API.updateProject(projectId, {
                                    ...project,
                                    status: newStatus
                                });
                                showToast('Статус: ' + newStatus, 'success');
                                await CRM.load();
                                renderProjects();
                            }
                        } catch (err) {
                            showToast('Ошибка', 'error');
                        }
                    }
                });
            });
        }
        
        window.showNewProjectModal = function() {
            const overlay = document.getElementById('modalOverlay');
            overlay.innerHTML = `
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3 class="modal-title">Новый проект</h3><button class="modal-close" onclick="closeModal()" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                    <div class="modal-body">
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="newProjectName">Название *</label><input type="text" class="form-input" id="newProjectName" placeholder="Название проекта" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                            <div class="form-group"><label class="form-label" for="newProjectClient">Клиент *</label><input type="text" class="form-input" id="newProjectClient" placeholder="Имя клиента" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="newProjectPhone">Телефон</label><input type="tel" class="form-input" id="newProjectPhone" placeholder="+7 (999) 123-45-67" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                            <div class="form-group"><label class="form-label" for="newProjectAmount">Сумма (₽)</label><input type="text" class="form-input" id="newProjectAmount" placeholder="0" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()" oninput="formatAmountField(this)"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="newProjectDeadline">Дедлайн</label><input type="date" class="form-input" id="newProjectDeadline" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                            <div class="form-group"><label class="form-label" for="newProjectPayDate">Дата оплаты</label><input type="date" class="form-input" id="newProjectPayDate" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                            <div class="form-group"><label class="form-label" for="newProjectStatus">Статус</label><select class="form-select" id="newProjectStatus" onclick="event.stopPropagation()"><option>Новый</option><option>Переговоры</option><option>В работе</option></select></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="newProjectSource">Источник</label><select class="form-select" id="newProjectSource" onclick="event.stopPropagation()"><option>Сайт</option><option>Авито</option><option>Telegram</option><option>Реклама</option><option>Знакомые</option></select></div>
                            <div class="form-group"><label class="form-label" for="newProjectAdequacy">Адекватность</label><select class="form-select" id="newProjectAdequacy" onclick="event.stopPropagation()"><option value="good">Нормальный</option><option value="warn">Осторожно</option><option value="bad">Не работаем</option></select></div>
                        </div>
                        <div class="form-group"><label class="form-label" for="newProjectHashtags">Хештеги (через запятую)</label><input type="text" class="form-input" id="newProjectHashtags" placeholder="#wordpress, #сайт, #лендинг" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                        <div class="form-group"><label class="form-label" for="newProjectDescription">Описание</label><textarea class="form-textarea" id="newProjectDescription" placeholder="Описание проекта" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></textarea></div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="createProject()">Создать</button></div>
                </div>
            `;
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
        };
        
        window.formatAmountField = function(input) {
            let value = input.value.replace(/\s/g, '').replace(/[^\d]/g, '');
            if (value) {
                input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            }
        };
        
        window.createProject = async function() {
            const modal = document.querySelector('.modal-overlay.show .modal') || document;
            const submitBtn = modal.querySelector('.btn-primary') || this;
            await withButtonLock(submitBtn, async () => {
                if (!validateForm([
                    { id: 'newProjectName', required: true, message: 'Введите название' },
                    { id: 'newProjectClient', required: true, message: 'Введите клиента' }
                ])) return;
                const name = document.getElementById('newProjectName').value.trim();
                const client = document.getElementById('newProjectClient').value.trim();
                
                const hashtagsRaw = document.getElementById('newProjectHashtags').value.trim();
                const hashtags = hashtagsRaw ? hashtagsRaw.split(',').map(h => h.trim().startsWith('#') ? h.trim() : '#' + h.trim()).filter(h => h.length > 1) : [];
                
                const amountStr = document.getElementById('newProjectAmount').value.replace(/\s/g, '').replace(/[^\d]/g, '');
                
                await CRM.createProject({
                    name: name,
                    client: client,
                    phone: document.getElementById('newProjectPhone').value.trim(),
                    amount: parseInt(amountStr) || 0,
                    deadline: document.getElementById('newProjectDeadline').value || '—',
                    payment_due_date: document.getElementById('newProjectPayDate').value || '',
                    status: document.getElementById('newProjectStatus').value,
                    source: document.getElementById('newProjectSource').value,
                    adequacy: document.getElementById('newProjectAdequacy').value,
                    description: document.getElementById('newProjectDescription').value || '',
                    urgent: false,
                    progress: 0,
                    pay_status: 'unpaid',
                    pay_method: 'По счёту',
                    discount: 'no',
                    discount_val: '',
                    hashtags: hashtags
                });
                
                closeModal();
                showToast('Проект создан', 'success');
                await CRM.load();
                renderProjects();
            });
        };

        // ===== COLUMN CONFIGURATION =====
        window.showColumnConfigModal = async function() {
            await loadColumns();
            const overlay = document.getElementById('modalOverlay');
            const colors = ['blue', 'yellow', 'green', 'gray', 'red', 'purple'];
            const colorLabels = { blue: 'Синий', yellow: 'Жёлтый', green: 'Зелёный', gray: 'Серый', red: 'Красный', purple: 'Фиолетовый' };
            const colorDotsCSS = { blue: 'var(--info)', yellow: 'var(--warning)', green: 'var(--success)', gray: 'var(--gray-400)', red: 'var(--danger)', purple: 'var(--primary)' };

            function renderColList() {
                return kanbanColumns.map(c => `
                    <div class="col-config-item" data-col-id="${c.id}" draggable="true">
                        <div class="col-config-handle" title="Перетащить для изменения порядка">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></svg>
                        </div>
                        <div class="col-config-dot" style="background:${colorDotsCSS[c.color] || 'var(--gray-400)'}"></div>
                        <div class="col-config-name">${c.name}</div>
                        <select class="form-select" style="width:auto;padding:2px 6px;font-size:0.75rem;" onchange="updateColumnColor(${c.id}, this.value)">
                            ${colors.map(cl => `<option value="${cl}" ${c.color === cl ? 'selected' : ''}>${colorLabels[cl]}</option>`).join('')}
                        </select>
                        <button class="btn btn-ghost btn-sm" style="color:var(--danger);padding:2px 6px;" onclick="deleteColumn(${c.id})" aria-label="Удалить">✕</button>
                    </div>
                `).join('');
            }

            overlay.innerHTML = `
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3 class="modal-title">Настройка колонок</h3><button class="modal-close" onclick="closeModal()" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                    <div class="modal-body">
                        <div style="font-size:0.8rem;color:var(--gray-500);margin-bottom:12px;">Перетащите колонки для изменения порядка</div>
                        <div id="colConfigList">${renderColList()}</div>
                        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-200);">
                            <div style="font-weight:600;font-size:0.85rem;margin-bottom:8px;">Добавить колонку</div>
                            <div style="display:flex;gap:8px;">
                                <input type="text" class="form-input" id="newColName" placeholder="Название" style="flex:1;">
                                <select class="form-select" id="newColColor" style="width:auto;">
                                    ${colors.map(cl => `<option value="${cl}">${colorLabels[cl]}</option>`).join('')}
                                </select>
                                <button class="btn btn-primary btn-sm" onclick="addColumn()">Добавить</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';

            // Init drag-and-drop for reordering
            initColumnDragDrop();
        };

        function initColumnDragDrop() {
            const list = document.getElementById('colConfigList');
            if (!list) return;
            let draggedEl = null;

            list.querySelectorAll('.col-config-item').forEach(item => {
                item.addEventListener('dragstart', (e) => {
                    draggedEl = item;
                    item.classList.add('col-dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', item.dataset.colId);
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('col-dragging');
                    document.querySelectorAll('.col-drag-over').forEach(el => el.classList.remove('col-drag-over'));
                    draggedEl = null;
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (draggedEl && draggedEl !== item) {
                        item.classList.add('col-drag-over');
                    }
                });
                item.addEventListener('dragleave', () => {
                    item.classList.remove('col-drag-over');
                });
                item.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    item.classList.remove('col-drag-over');
                    if (!draggedEl || draggedEl === item) return;

                    // Determine position
                    const rect = item.getBoundingClientRect();
                    const midY = rect.top + rect.height / 2;
                    if (e.clientY < midY) {
                        list.insertBefore(draggedEl, item);
                    } else {
                        list.insertBefore(draggedEl, item.nextSibling);
                    }

                    // Save new order
                    await saveColumnOrder();
                });
            });
        }

        async function saveColumnOrder() {
            const items = document.querySelectorAll('#colConfigList .col-config-item');
            const updates = [];
            items.forEach((item, index) => {
                updates.push({ id: parseInt(item.dataset.colId), sort_order: index });
            });

            try {
                for (const u of updates) {
                    await API.put(`/api/kanban-columns/${u.id}`, { sort_order: u.sort_order });
                }
                await loadColumns();
                renderProjects();
            } catch (err) {
                showToast('Ошибка сохранения порядка', 'error');
            }
        }

        window.addColumn = async function() {
            const name = document.getElementById('newColName').value.trim();
            const color = document.getElementById('newColColor').value;
            if (!name) { showToast('Введите название', 'error'); return; }
            try {
                await API.post('/api/kanban-columns', { name, color });
                showToast('Колонка добавлена', 'success');
                await loadColumns();
                await CRM.load();
                renderProjects();
                showColumnConfigModal();
            } catch (err) {
                showToast(err.message || 'Ошибка', 'error');
            }
        };

        window.updateColumnColor = async function(id, color) {
            try {
                await API.put(`/api/kanban-columns/${id}`, { color });
                await loadColumns();
                renderProjects();
            } catch (err) {
                showToast('Ошибка', 'error');
            }
        };

        window.deleteColumn = async function(id) {
            const col = kanbanColumns.find(c => c.id === id);
            if (!col) return;
            try {
                await API.delete(`/api/kanban-columns/${id}`);
                showToast('Колонка удалена', 'success');
                await loadColumns();
                await CRM.load();
                renderProjects();
                showColumnConfigModal();
            } catch (err) {
                showToast(err.message || 'Ошибка', 'error');
            }
        };
    })();
    </script>
</body>
</html>
