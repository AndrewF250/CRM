<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеграции — CRM System</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=59">
</head>
<body>
    <div id="app"></div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="/assets/js/api.js?v=24"></script>
    <script src="/assets/js/app.js?v=54"></script>
    <script>
    (async function() {
        if (!API.requireAuth()) return;
        const me = API.getCurrentUser();
        const isAdmin = me?.role === 'admin';
        let rows = [];
        let lastHealthAt = null;
        let activeAiId = null;
        const DOMAIN = 'http://crm-seo-123.xyz/';

        const app = document.getElementById('app');
        app.innerHTML = renderSidebar('integrations') + renderHeader() + `
            <div class="int-sticky" id="intSticky">
                <div class="page-header" style="margin-bottom:8px;">
                    <div>
                        <h1 class="page-title">Интеграции <span class="badge badge-gray" id="pageVersionBadge" title="Версия">v…</span></h1>
                        <p class="page-subtitle tip" data-tip="Публичный адрес CRM" title="${DOMAIN}">${DOMAIN}</p>
                    </div>
                    <div class="page-actions" style="align-items:center;">
                        <span class="int-refresh-meta" id="healthUpdatedAt">ещё не обновляли</span>
                        <button class="btn btn-secondary tip" id="btnRefreshHealth" data-tip="Обновить health и статусы" title="Обновить" aria-label="Обновить" style="padding:8px 10px;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                        </button>
                    </div>
                </div>
                <div class="stats-grid" id="healthStats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));"></div>
                <div class="int-tabs" id="intTabs">
                    <button type="button" class="int-tab active" data-target="secGithub">GitHub</button>
                    <button type="button" class="int-tab" data-target="secServer">Сервер</button>
                    <button type="button" class="int-tab" data-target="secAi">AI</button>
                </div>
            </div>

            <div id="secGithub" class="int-section"></div>
            <div id="secServer" class="int-section" style="margin-top:16px;"></div>
            <div id="secAi" class="int-section" style="margin-top:16px;"></div>

            <div class="card" style="margin-top:16px;margin-bottom:16px;">
                <div class="card-header"><h3 class="card-title tip" data-tip="Служебные записи CRM">Прочие подключения</h3></div>
                <div class="card-body" id="integrationsList"><p class="text-muted">Загрузка…</p></div>
            </div>
            </div></div></div>
        `;

        initCommonUI();

        function esc(s) { return escapeHtmlText(String(s ?? '')); }
        function tipAttr(text) {
            return ` class="tip" data-tip="${esc(text).replace(/"/g, '&quot;')}" title="${esc(text).replace(/"/g, '&quot;')}"`;
        }
        function statusPill(status, configured) {
            if (status === 'ok') return `<span class="badge badge-success tip" data-tip="Подключено / OK">подключено</span>`;
            if (status === 'error') return `<span class="badge badge-danger tip" data-tip="Ошибка проверки">ошибка</span>`;
            if (configured) return `<span class="badge badge-warning tip" data-tip="Есть данные, нажмите проверить">ожидает</span>`;
            return `<span class="badge badge-gray tip" data-tip="Нет сохранённых секретов/хоста">не настроено</span>`;
        }
        function fmtUpdated(d) {
            if (!d) return 'ещё не обновляли';
            const x = new Date(d);
            const p = n => String(n).padStart(2, '0');
            return 'обновлено ' + p(x.getHours()) + ':' + p(x.getMinutes()) + ':' + p(x.getSeconds());
        }

        document.getElementById('intTabs').onclick = (e) => {
            const tab = e.target.closest('.int-tab');
            if (!tab) return;
            document.querySelectorAll('.int-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const el = document.getElementById(tab.dataset.target);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        async function loadHealth() {
            const box = document.getElementById('healthStats');
            try {
                const h = await API.get('/api/integrations/health');
                lastHealthAt = Date.now();
                document.getElementById('healthUpdatedAt').textContent = fmtUpdated(lastHealthAt);
                const upMin = Math.floor((h.server?.uptimeSec || 0) / 60);
                const ver = h.version || window.CRM_APP_VERSION || '—';
                const vb = document.getElementById('pageVersionBadge');
                if (vb) vb.textContent = 'v' + ver;
                box.innerHTML = `
                    <div class="stat-card"${tipAttr('Общий статус')}>
                        <div class="stat-info"><div class="stat-label">Состояние</div>
                        <div class="stat-value" style="color:${h.ok ? 'var(--success)' : 'var(--danger)'}">${h.ok ? 'OK' : 'FAIL'}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Версия CRM')}>
                        <div class="stat-info"><div class="stat-label">Версия</div><div class="stat-value">${esc(ver)}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Домен')}>
                        <div class="stat-info"><div class="stat-label">Домен</div><div class="stat-value" style="font-size:0.85rem !important;">crm-seo-123</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Uptime')}>
                        <div class="stat-info"><div class="stat-label">Uptime</div><div class="stat-value">${upMin}м</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('БД')}>
                        <div class="stat-info"><div class="stat-label">БД</div>
                        <div class="stat-value" style="color:${h.db?.ok ? 'var(--success)' : 'var(--danger)'}">${h.db?.ok ? 'OK' : 'FAIL'}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Пользователи')}>
                        <div class="stat-info"><div class="stat-label">Юзеры</div><div class="stat-value">${h.db?.users ?? '—'}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Проекты')}>
                        <div class="stat-info"><div class="stat-label">Проекты</div><div class="stat-value">${h.db?.projects ?? '—'}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Открытые задачи')}>
                        <div class="stat-info"><div class="stat-label">Задачи</div><div class="stat-value">${h.db?.tasksOpen ?? '—'}</div></div>
                    </div>
                    <div class="stat-card"${tipAttr('Интеграции OK')}>
                        <div class="stat-info"><div class="stat-label">Интегр.</div>
                        <div class="stat-value" style="color:var(--success);">${h.integrations?.ok ?? 0}/${h.integrations?.total ?? 0}</div></div>
                    </div>
                `;
            } catch (e) {
                box.innerHTML = '<p class="text-muted">Не удалось получить health</p>';
            }
        }

        function renderGithub() {
            const gh = rows.find(r => r.type === 'github');
            const box = document.getElementById('secGithub');
            if (!gh) { box.innerHTML = '<p class="text-muted">Нет GitHub</p>'; return; }
            const c = gh.config || {};
            box.innerHTML = `
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                    <h3 class="card-title tip" data-tip="Репозиторий для деплоя">GitHub</h3>
                    ${statusPill(gh.status, gh.configured)}
                </div>
                <div class="card-body">
                    <div class="grid-2">
                        <div class="form-group"><label class="form-label tip" data-tip="URL репозитория">Repo URL</label>
                            <input class="form-input" id="ghRepo" value="${esc(c.repoUrl || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Ветка">Branch</label>
                            <input class="form-input" id="ghBranch" value="${esc(c.branch || 'main')}" ${isAdmin ? '' : 'readonly'}></div>
                    </div>
                    <div class="form-group"><label class="form-label tip" data-tip="Token для private">GitHub token</label>
                        <input class="form-input" id="ghToken" type="password" placeholder="${c.has_token ? '•••• сохранён' : 'ghp_…'}" ${isAdmin ? '' : 'readonly'}></div>
                    ${isAdmin ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary tip" data-tip="Сохранить в vault" onclick="saveGithub(${gh.id})">Сохранить</button>
                        <button class="btn btn-secondary tip" data-tip="Проверить конфиг" onclick="testIntegration(${gh.id})">Проверить</button>
                    </div>` : ''}
                </div>
            </div>`;
        }

        function renderServer() {
            const ssh = rows.find(r => r.type === 'ssh_deploy' || r.type === 'server_ssh');
            const box = document.getElementById('secServer');
            if (!ssh) { box.innerHTML = '<p class="text-muted">Нет SSH</p>'; return; }
            const c = ssh.config || {};
            const auto = !!(ssh.meta && ssh.meta.auto_connect);
            box.innerHTML = `
            <div class="card">
                <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
                    <h3 class="card-title tip" data-tip="SSH деплой на прод">Сервер (SSH)</h3>
                    ${statusPill(ssh.status, ssh.configured)}
                </div>
                <div class="card-body">
                    <p class="text-sm text-muted tip" data-tip="Публичный домен CRM" style="margin:0 0 12px;">
                        Домен: <a href="${DOMAIN}" target="_blank" rel="noopener">${DOMAIN}</a>
                    </p>
                    <div class="grid-2">
                        <div class="form-group"><label class="form-label tip" data-tip="IP/хост">Host</label>
                            <input class="form-input" id="sshHost" value="${esc(c.host || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Порт SSH">Port</label>
                            <input class="form-input" id="sshPort" value="${esc(c.port || 22)}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Логин">Username</label>
                            <input class="form-input" id="sshUser" value="${esc(c.username || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Пароль в vault">Password</label>
                            <input class="form-input" id="sshPass" type="password" placeholder="${c.has_password ? '•••• сохранён' : 'пароль'}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Папка приложения">App dir</label>
                            <input class="form-input" id="sshApp" value="${esc(c.appDir || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Папка бэкапов">Backup dir</label>
                            <input class="form-input" id="sshBackup" value="${esc(c.backupDir || '')}" ${isAdmin ? '' : 'readonly'}></div>
                    </div>
                    ${isAdmin ? `
                    <label class="form-check tip" data-tip="При открытии страницы сразу проверять SSH" style="margin-bottom:12px;">
                        <input type="checkbox" id="sshAutoConnect" ${auto ? 'checked' : ''}> Сохранять и подключать автоматически
                    </label>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
                        <button class="btn btn-primary tip" data-tip="Сохранить SSH" onclick="saveSsh(${ssh.id})">Сохранить</button>
                        <button class="btn btn-secondary tip" data-tip="Проверить SSH" onclick="testIntegration(${ssh.id})">Проверить SSH</button>
                        <button class="btn btn-secondary tip" data-tip="Копия БД перед деплоем" onclick="runBackup(${ssh.id})">Копия БД</button>
                        <button class="btn btn-primary tip" data-tip="Деплой с GitHub + миграции БД" onclick="runDeploy(${ssh.id})">Деплой с GitHub</button>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-secondary tip" data-tip="Откатить к prev" onclick="runRestore(${ssh.id})">Откатить БД</button>
                        <button class="btn btn-danger tip" data-tip="Оставить только старую БД" onclick="runKeepOld(${ssh.id})">Оставить старую БД</button>
                    </div>
                    <pre id="deployLog" class="text-sm" style="margin-top:14px;max-height:200px;overflow:auto;background:var(--gray-50);padding:12px;border-radius:8px;white-space:pre-wrap;"></pre>
                    ` : ''}
                </div>
            </div>`;
        }

        function renderAi() {
            const box = document.getElementById('secAi');
            const ais = rows.filter(r => String(r.type || '').startsWith('ai_'));
            if (!ais.length) {
                box.innerHTML = '<div class="card"><div class="card-body"><p class="text-muted">Нет AI</p>' +
                    (isAdmin ? '<button class="btn btn-primary" onclick="addAi()">+ Добавить</button>' : '') + '</div></div>';
                return;
            }
            if (!activeAiId || !ais.some(a => a.id === activeAiId)) activeAiId = ais[0].id;
            const active = ais.find(a => a.id === activeAiId) || ais[0];
            const m = active.meta || {};
            const c = active.config || {};

            const tabs = ais.map(a => `
                <div class="int-ai-tab${a.id === activeAiId ? ' active' : ''}" data-ai="${a.id}">
                    <span class="ai-tab-label tip" data-tip="Двойной клик — переименовать" data-id="${a.id}">${esc(a.name)}</span>
                    ${isAdmin && a.type !== 'ai_openai' && a.type !== 'ai_claude' ? `<button type="button" class="btn btn-ghost btn-sm tip" data-tip="Удалить" data-del-ai="${a.id}" style="padding:0 4px;color:var(--danger);">&times;</button>` : ''}
                </div>`).join('');

            box.innerHTML = `
            <div class="card">
                <div class="card-body">
                    <div class="int-ai-tabs">
                        ${tabs}
                        ${isAdmin ? `<button type="button" class="int-ai-add tip" data-tip="Добавить нейронку" onclick="addAi()">+</button>` : ''}
                    </div>
                    <div class="grid-2">
                        <div class="form-group"><label class="form-label tip" data-tip="Токены использовано">Токенов использовано</label>
                            <input class="form-input ai-field" data-k="tokens_used" type="number" value="${esc(m.tokens_used || 0)}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Лимит тарифа">Лимит токенов</label>
                            <input class="form-input ai-field" data-k="tokens_limit" type="number" value="${esc(m.tokens_limit || 0)}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Дата покупки">Дата покупки</label>
                            <input class="form-input ai-field" data-k="purchase_date" type="date" value="${esc(m.purchase_date || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Обновление тарифа">Дата обновления тарифа</label>
                            <input class="form-input ai-field" data-k="renew_date" type="date" value="${esc(m.renew_date || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="Название тарифа">Тариф</label>
                            <input class="form-input ai-field" data-k="tariff" value="${esc(m.tariff || '')}" ${isAdmin ? '' : 'readonly'}></div>
                        <div class="form-group"><label class="form-label tip" data-tip="API key в vault">API key</label>
                            <input class="form-input" id="aiKeyActive" type="password" placeholder="${c.has_api_key ? '•••• сохранён' : 'sk-…'}" ${isAdmin ? '' : 'readonly'}></div>
                    </div>
                    ${isAdmin ? `<button class="btn btn-primary tip" data-tip="Сохранить AI" onclick="saveAiActive()">Сохранить</button>` : ''}
                </div>
            </div>`;

            box.querySelectorAll('.int-ai-tab[data-ai]').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    if (e.target.closest('[data-del-ai]') || e.target.closest('input')) return;
                    activeAiId = Number(tab.dataset.ai);
                    renderAi();
                });
            });
            box.querySelectorAll('[data-del-ai]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!confirm('Удалить нейронку?')) return;
                    try {
                        await API.delete('/api/integrations/' + btn.dataset.delAi);
                        showToast('Удалено', 'success');
                        await loadIntegrations();
                    } catch (err) { showToast(err.message || 'Ошибка', 'error'); }
                });
            });
            box.querySelectorAll('.ai-tab-label').forEach(label => {
                label.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    if (!isAdmin) return;
                    const id = Number(label.dataset.id);
                    const row = ais.find(a => a.id === id);
                    if (!row) return;
                    const input = document.createElement('input');
                    input.value = row.name;
                    input.className = 'form-input';
                    input.style.cssText = 'width:140px;padding:2px 6px;font-size:0.85rem;';
                    label.replaceWith(input);
                    input.focus();
                    input.select();
                    const commit = async () => {
                        const name = input.value.trim();
                        if (!name || name === row.name) { renderAi(); return; }
                        try {
                            await API.put('/api/integrations/' + id, { name });
                            showToast('Переименовано', 'success');
                            await loadIntegrations();
                        } catch (err) {
                            showToast(err.message || 'Ошибка', 'error');
                            renderAi();
                        }
                    };
                    input.addEventListener('blur', commit);
                    input.addEventListener('keydown', (ev) => {
                        if (ev.key === 'Enter') { ev.preventDefault(); input.blur(); }
                        if (ev.key === 'Escape') renderAi();
                    });
                });
            });
        }

        const OTHER_HELP = {
            server: 'Текущий процесс CRM',
            database: 'SQLite crm.db',
            subscription: 'Биллинг хостинга/домена',
            domain: 'Публичный домен CRM'
        };

        async function loadIntegrations() {
            const list = document.getElementById('integrationsList');
            try {
                rows = await API.get('/api/integrations') || [];
                renderGithub();
                renderServer();
                renderAi();
                const other = rows.filter(r => !['github', 'ssh_deploy', 'server_ssh'].includes(r.type) && !String(r.type).startsWith('ai_'));
                list.innerHTML = other.map(r => {
                    const help = OTHER_HELP[r.type] || (r.meta && (r.meta.label || r.meta.url || r.meta.domain)) || r.type;
                    const ok = r.status === 'ok';
                    const extra = (r.meta && (r.meta.url || r.meta.domain)) ? ' · ' + (r.meta.url || r.meta.domain) : '';
                    return `<div style="display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--gray-100);align-items:center;" class="tip" data-tip="${esc(help)}">
                        <div><div style="font-weight:600;${ok ? 'color:var(--success);' : ''}">${esc(r.name)}</div>
                        <div class="text-sm text-muted">${esc(help)}${esc(extra)}</div></div>
                        ${statusPill(r.status, r.configured)}
                    </div>`;
                }).join('') || '<p class="text-muted">Нет записей</p>';
            } catch (e) {
                list.innerHTML = '<p class="text-muted">Ошибка загрузки</p>';
            }
        }

        function setLog(text) {
            const el = document.getElementById('deployLog');
            if (el) el.textContent = text || '';
        }

        window.saveGithub = async function(id) {
            try {
                const secret = {
                    repoUrl: document.getElementById('ghRepo').value.trim(),
                    branch: document.getElementById('ghBranch').value.trim() || 'main'
                };
                const token = document.getElementById('ghToken').value;
                if (token) secret.token = token;
                await API.put('/api/integrations/' + id, { meta: { repoUrl: secret.repoUrl, branch: secret.branch }, secret });
                showToast('GitHub сохранён', 'success');
                await loadIntegrations();
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };

        window.saveSsh = async function(id) {
            try {
                const secret = {
                    host: document.getElementById('sshHost').value.trim(),
                    port: Number(document.getElementById('sshPort').value) || 22,
                    username: document.getElementById('sshUser').value.trim(),
                    appDir: document.getElementById('sshApp').value.trim(),
                    backupDir: document.getElementById('sshBackup').value.trim()
                };
                const pass = document.getElementById('sshPass').value;
                if (pass) secret.password = pass;
                const auto = !!document.getElementById('sshAutoConnect')?.checked;
                await API.put('/api/integrations/' + id, {
                    meta: { ...secret, auto_connect: auto, domain: DOMAIN },
                    secret
                });
                showToast('SSH сохранён', 'success');
                if (auto) await testIntegration(id);
                else await loadIntegrations();
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };

        window.addAi = async function() {
            try {
                const created = await API.post('/api/integrations', { name: 'Новая нейронка', type: '' });
                activeAiId = created.id;
                showToast('Добавлено', 'success');
                await loadIntegrations();
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };

        window.saveAiActive = async function() {
            if (!activeAiId) return;
            try {
                const meta = {};
                document.querySelectorAll('#secAi .ai-field').forEach(inp => {
                    let v = inp.value;
                    if (inp.dataset.k === 'tokens_used' || inp.dataset.k === 'tokens_limit') v = Number(v) || 0;
                    meta[inp.dataset.k] = v;
                });
                const secret = {};
                const key = document.getElementById('aiKeyActive')?.value;
                if (key) secret.api_key = key;
                await API.put('/api/integrations/' + activeAiId, { meta, secret });
                showToast('Сохранено', 'success');
                await loadIntegrations();
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };

        window.testIntegration = async function(id) {
            try {
                setLog('Проверка…');
                const r = await API.post('/api/integrations/' + id + '/test', {});
                setLog(JSON.stringify(r, null, 2));
                showToast(r.ok ? 'OK' : (r.error || 'Ошибка'), r.ok ? 'success' : 'error');
                await loadIntegrations();
            } catch (e) { setLog(e.message || String(e)); showToast(e.message || 'Ошибка', 'error'); }
        };
        window.runBackup = async function(id) {
            if (!confirm('Копия crm.db?')) return;
            try {
                setLog('Бэкап…');
                const r = await API.post('/api/integrations/' + id + '/backup', {});
                setLog((r.out || '') + '\n' + (r.path || ''));
                showToast(r.ok ? 'Бэкап готов' : 'Ошибка', r.ok ? 'success' : 'error');
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };
        window.runDeploy = async function(id) {
            if (!confirm('Деплой с GitHub?')) return;
            try {
                setLog('Деплой…');
                const r = await API.post('/api/integrations/' + id + '/deploy', {});
                setLog((r.out || '') + '\n' + (r.err || ''));
                showToast(r.ok ? 'Деплой OK' : 'Ошибка', r.ok ? 'success' : 'error');
                await loadHealth();
                await loadIntegrations();
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };
        window.runRestore = async function(id) {
            if (!confirm('Откатить БД?')) return;
            try {
                const r = await API.post('/api/integrations/' + id + '/restore-prev', {});
                setLog(r.out || '');
                showToast(r.ok ? 'Откат OK' : 'Ошибка', r.ok ? 'success' : 'error');
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };
        window.runKeepOld = async function(id) {
            if (!confirm('Оставить только старую БД?')) return;
            try {
                const r = await API.post('/api/integrations/' + id + '/keep-old-db', {});
                setLog(r.out || '');
                showToast(r.ok ? 'Старая БД активна' : 'Ошибка', r.ok ? 'success' : 'error');
            } catch (e) { showToast(e.message || 'Ошибка', 'error'); }
        };

        document.getElementById('btnRefreshHealth').onclick = async () => {
            await loadHealth();
            await loadIntegrations();
            showToast('Обновлено', 'success');
        };

        await loadHealth();
        await loadIntegrations();
        const ssh = rows.find(r => r.type === 'ssh_deploy' || r.type === 'server_ssh');
        if (isAdmin && ssh?.meta?.auto_connect && ssh.config?.has_password) {
            try { await testIntegration(ssh.id); } catch (e) {}
        }
    })();
    </script>
</body>
</html>
