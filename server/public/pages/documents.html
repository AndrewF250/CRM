<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Документы — CRM System</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid var(--gray-200); padding-bottom: 0; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: 500; color: var(--gray-500); border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.15s; }
        .tab:hover { color: var(--gray-700); }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
        .template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
        .template-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 16px; transition: all 0.15s; }
        .template-card:hover { box-shadow: var(--shadow-sm); border-color: var(--primary); }
        .template-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
        .template-name { font-weight: 600; margin-bottom: 4px; }
        .template-meta { font-size: 0.8rem; color: var(--gray-500); }
        .template-actions { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--gray-100); }
        .category-badge { display: inline-block; padding: 2px 8px; border-radius: var(--radius-sm); font-size: 0.7rem; font-weight: 500; }
        .category-badge.shablon { background: #dbeafe; color: #1e40af; }
        .category-badge.prompt { background: #d1fae5; color: #065f46; }
        .category-badge.seo { background: #fef3c7; color: #92400e; }
        .category-badge.other { background: #f3f4f6; color: #374151; }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="modal-overlay" id="modalOverlay"></div>

    <script src="/assets/js/api.js?v=8"></script>
    <script src="/assets/js/app.js?v=8"></script>
    <script src="/assets/js/crm-data.js?v=8"></script>
    <script>
    (async function() {
        if (!API.requireAuth()) return;
        
        const app = document.getElementById('app');
        let currentTab = 'client';
        
        function render() {
            app.innerHTML = renderSidebar('documents') + renderHeader() + `
                <div class="page-header">
                    <div><h1 class="page-title">Документы</h1><p class="page-subtitle">Управление файлами</p></div>
                    <div class="page-actions">
                        <button class="btn btn-primary" onclick="showAddDocModal()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Загрузить
                        </button>
                    </div>
                </div>
                <div class="tabs">
                    <div class="tab ${currentTab === 'client' ? 'active' : ''}" onclick="switchTab('client')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                        Клиентские
                    </div>
                    <div class="tab ${currentTab === 'template' ? 'active' : ''}" onclick="switchTab('template')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>
                        Шаблоны и материалы
                    </div>
                </div>
                <div id="tabContent"></div>
                </div></div></div>
            `;
            
            renderTabContent();
            initCommonUI();
        }
        
        function renderTabContent() {
            if (currentTab === 'client') {
                loadClientDocs();
            } else {
                loadTemplateDocs();
            }
        }
        
        async function loadClientDocs() {
            const container = document.getElementById('tabContent');
            const docs = await API.get('/api/documents?category=client');
            
            if (!docs || docs.length === 0) {
                container.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:40px;"><p class="text-muted">Нет клиентских документов</p><button class="btn btn-primary" style="margin-top:16px;" onclick="showAddDocModal()">Добавить документ</button></div></div>';
                return;
            }
            
            const grouped = {};
            docs.forEach(d => {
                const key = d.project_id || 'other';
                if (!grouped[key]) grouped[key] = [];
                grouped[key].push(d);
            });
            
            let html = '';
            Object.keys(grouped).forEach(projectId => {
                const project = CRM.getProject(projectId);
                const projectDocs = grouped[projectId];
                const statusDot = project?.status === 'В работе' ? 'green' : project?.status === 'Переговоры' ? 'yellow' : 'blue';
                
                html += `<div class="card" style="margin-bottom:16px;">
                    <div class="card-header">
                        <div style="display:flex;align-items:center;gap:8px;">
                            <span class="status-dot ${statusDot}"></span>
                            <h3 class="card-title"><a href="/pages/project.html?id=${projectId}" style="text-decoration:none;color:inherit;">${project ? project.client + ' — ' + project.name : 'Без проекта'}</a></h3>
                            <span class="badge badge-gray">${projectDocs.length}</span>
                        </div>
                    </div>
                    <div class="card-body" style="padding:0;">
                        <div class="docs-list">
                            ${projectDocs.map(d => renderDocItem(d)).join('')}
                        </div>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        async function loadTemplateDocs() {
            const container = document.getElementById('tabContent');
            const docs = await API.get('/api/documents?category=template');
            
            if (!docs || docs.length === 0) {
                container.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:40px;"><p class="text-muted">Нет шаблонов и материалов</p><button class="btn btn-primary" style="margin-top:16px;" onclick="showAddDocModal()">Добавить первый шаблон</button></div></div>';
                return;
            }
            
            const categories = {
                'Шаблон': { icon: '📄', color: '#3B82F6' },
                'Промпт': { icon: '🤖', color: '#10B981' },
                'SEO': { icon: '🔍', color: '#F59E0B' },
                'Другое': { icon: '📁', color: '#6B7280' }
            };
            
            const grouped = {};
            docs.forEach(d => {
                const cat = d.template_category || 'Другое';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(d);
            });
            
            let html = '';
            Object.keys(grouped).forEach(cat => {
                const catDocs = grouped[cat];
                const catInfo = categories[cat] || categories['Другое'];
                const catClass = cat === 'Шаблон' ? 'shablon' : cat === 'Промпт' ? 'prompt' : cat === 'SEO' ? 'seo' : 'other';
                
                html += `<div style="margin-bottom:24px;">
                    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
                        <span style="font-size:1.2rem;">${catInfo.icon}</span>
                        <h3 style="font-weight:600;font-size:1rem;">${cat}</h3>
                        <span class="badge badge-gray">${catDocs.length}</span>
                    </div>
                    <div class="template-grid">
                        ${catDocs.map(d => `
                            <div class="template-card">
                                <div class="template-icon" style="background:${catInfo.color}15;">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${catInfo.color}" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                                </div>
                                <div class="template-name">${d.name}</div>
                                <div class="template-meta">${d.type || ''} · ${d.size || ''}</div>
                                <div class="template-actions">
                                    ${d.file_path ? `<a href="/uploads/${d.file_path}" download="${d.name}" class="btn btn-ghost btn-sm">Скачать</a>` : ''}
                                    <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteDoc(${d.id})">Удалить</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        function renderDocItem(d) {
            const colors = { PDF: '#EF4444', DOCX: '#3B82F6', XLSX: '#10B981', ZIP: '#F59E0B', PNG: '#8B5CF6', JPG: '#8B5CF6', JPEG: '#8B5CF6', TXT: '#6B7280', MD: '#6B7280' };
            const color = colors[d.type?.toUpperCase()] || '#6B7280';
            return `<div class="doc-item">
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:36px;height:36px;border-radius:8px;background:${color}15;display:flex;align-items:center;justify-content:center;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
                    </div>
                    <div>
                        <div class="fw-600">${d.name}</div>
                        <div class="text-sm text-muted">${d.type || ''} · ${d.size || ''}</div>
                    </div>
                </div>
                <div style="display:flex;gap:8px;">
                    ${d.file_path ? `<a href="/uploads/${d.file_path}" download="${d.name}" class="btn btn-ghost btn-sm">Скачать</a>` : ''}
                    <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="deleteDoc(${d.id})">Удалить</button>
                </div>
            </div>`;
        }
        
        window.switchTab = function(tab) {
            currentTab = tab;
            render();
        };
        
        window.deleteDoc = async function(id) {
            confirmDelete('Удалить документ?', async () => {
                try {
                    await API.delete(`/api/documents/${id}`);
                    showToast('Документ удалён', 'success');
                    renderTabContent();
                } catch (err) {
                    showToast('Ошибка: ' + err.message, 'error');
                }
            });
        };
        
        window.showAddDocModal = function() {
            const overlay = document.getElementById('modalOverlay');
            let projectOptions = '<option value="">Без проекта</option>';
            CRM.getProjects().forEach(p => {
                projectOptions += `<option value="${p.id}">${p.client} — ${p.name}</option>`;
            });
            
            const isTemplate = currentTab === 'template';
            
            overlay.innerHTML = `
                <div class="modal" onclick="event.stopPropagation()">
                    <div class="modal-header"><h3 class="modal-title">${isTemplate ? 'Добавить шаблон/материал' : 'Загрузить документ клиента'}</h3><button class="modal-close" onclick="closeModal()" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
                    <div class="modal-body">
                        ${!isTemplate ? '<div class="form-group"><label class="form-label" for="docProject">Проект *</label><select class="form-select" id="docProject" onclick="event.stopPropagation()">' + projectOptions + '</select></div>' : ''}
                        ${isTemplate ? `<div class="form-group"><label class="form-label" for="templateCategory">Категория</label><select class="form-select" id="templateCategory" onclick="event.stopPropagation()"><option>Шаблон</option><option>Промпт</option><option>SEO</option><option>Другое</option></select></div>` : ''}
                        <div class="form-group"><label class="form-label" for="docName">Название файла *</label><input type="text" class="form-input" id="docName" placeholder="${isTemplate ? 'Шаблон договора.docx' : 'Договор.pdf'}" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                        <div class="form-row">
                            <div class="form-group"><label class="form-label" for="docType">Тип</label><select class="form-select" id="docType" onclick="event.stopPropagation()"><option>PDF</option><option>DOCX</option><option>XLSX</option><option>TXT</option><option>MD</option><option>ZIP</option><option>PNG</option><option>JPG</option></select></div>
                            <div class="form-group"><label class="form-label" for="docSize">Размер</label><input type="text" class="form-input" id="docSize" placeholder="245 KB" onclick="event.stopPropagation()" onkeydown="event.stopPropagation()"></div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="fileInput">Файл</label>
                            <div id="dropZone" style="border:2px dashed var(--gray-300);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all 0.2s;" onclick="document.getElementById('fileInput').click()">
                                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" stroke-width="1.5" style="margin:0 auto 8px;display:block;"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17,8 12,3 7,8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                                <p class="fw-600 text-muted" id="fileLabel">Нажмите или перетащите файл</p>
                                <p class="text-xs text-muted">PDF, DOCX, XLSX, TXT, MD, ZIP, PNG, JPG</p>
                            </div>
                            <input type="file" id="fileInput" style="display:none" accept=".pdf,.docx,.xlsx,.txt,.md,.zip,.png,.jpg,.jpeg">
                        </div>
                    </div>
                    <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">Отмена</button><button class="btn btn-primary" onclick="uploadDocument()">Загрузить</button></div>
                </div>
            `;
            
            overlay.classList.add('show');
            document.body.style.overflow = 'hidden';
            
            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) handleFile(this.files[0]);
            });
            
            dropZone.addEventListener('dragover', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--primary)';
                this.style.background = 'var(--primary-light)';
            });
            
            dropZone.addEventListener('dragleave', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--gray-300)';
                this.style.background = 'transparent';
            });
            
            dropZone.addEventListener('drop', function(e) {
                e.preventDefault();
                this.style.borderColor = 'var(--gray-300)';
                this.style.background = 'transparent';
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
            });
        };
        
        let selectedFile = null;
        
        function handleFile(file) {
            selectedFile = file;
            document.getElementById('fileLabel').textContent = file.name;
            document.getElementById('fileLabel').style.color = 'var(--primary)';
            
            const nameInput = document.getElementById('docName');
            if (!nameInput.value) nameInput.value = file.name;
            
            const ext = file.name.split('.').pop().toUpperCase();
            const typeSelect = document.getElementById('docType');
            if (['PDF','DOCX','XLSX','TXT','MD','ZIP','PNG','JPG','JPEG'].includes(ext)) {
                typeSelect.value = ext === 'JPEG' ? 'JPG' : ext;
            }
            
            const sizeInput = document.getElementById('docSize');
            if (!sizeInput.value) sizeInput.value = formatFileSize(file.size);
        }
        
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
        
        window.uploadDocument = async function() {
            const modal = document.querySelector('.modal-overlay.show .modal') || document;
            const submitBtn = modal.querySelector('.btn-primary') || this;
            await withButtonLock(submitBtn, async () => {
                const isTemplate = currentTab === 'template';
                
                if (!validateForm([
                    { id: 'docName', required: true, message: 'Введите название файла' }
                ])) return;
                
                const name = document.getElementById('docName').value.trim();
                
                const doc_category = isTemplate ? 'template' : 'client';
                const project_id = isTemplate ? null : document.getElementById('docProject')?.value;
                const template_category = isTemplate ? document.getElementById('templateCategory')?.value : null;
                
                if (!isTemplate && !project_id) { showToast('Выберите проект', 'error'); return; }
                
                if (selectedFile) {
                    const formData = new FormData();
                    formData.append('file', selectedFile);
                    formData.append('project_id', project_id || '');
                    formData.append('name', name);
                    formData.append('type', document.getElementById('docType').value);
                    formData.append('size', document.getElementById('docSize').value || formatFileSize(selectedFile.size));
                    formData.append('doc_category', doc_category);
                    if (template_category) formData.append('template_category', template_category);
                    
                    const response = await fetch('/api/documents/upload', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + API.token },
                        body: formData
                    });
                    
                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error || 'Upload failed');
                    }
                } else {
                    await API.post('/api/documents', {
                        project_id: project_id,
                        name: name,
                        type: document.getElementById('docType').value,
                        size: document.getElementById('docSize').value || '',
                        doc_category: doc_category,
                        template_category: template_category
                    });
                }
                
                closeModal();
                selectedFile = null;
                showToast('Документ загружен', 'success');
                renderTabContent();
            });
        };
        
        await CRM.load();
        render();
    })();
    </script>
</body>
</html>
